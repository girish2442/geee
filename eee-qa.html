<script>
// Fields: id,m(module),tp(topic),d,imp,ty,mk,q,h(hint),s(steps),a(final answer),mi(common mistake),sim,sa
const Q=[
{id:1,m:1,tp:"KCL",d:"Level 1",imp:"📌 Must Know",ty:"Theory",mk:2,q:"State Kirchhoff's Current Law (KCL).",h:"Think: what goes into a node must come out.",s:["2-MARK ANSWER: At any node, the algebraic sum of currents is zero. Equivalently, total current entering a node = total current leaving it.","UNDERSTANDING: A node is a point where two or more elements join. Charge cannot pile up at a node, so whatever flows in must flow out. This is conservation of charge.","Picture:\n   I1 →  ● → I2\n         ↓\n         I3\nI1 = I2 + I3  (or I1 − I2 − I3 = 0)"],a:"ΣI(in) = ΣI(out), i.e. ΣI = 0 at a node.",mi:"Mixing up directions: pick one rule (entering = +, leaving = −) and keep it.",sim:"A node has 5 A and 3 A entering and I leaving. Find I.",sa:"I = 5 + 3 = 8 A."},
{id:2,m:1,tp:"KVL",d:"Level 1",imp:"📌 Must Know",ty:"Theory",mk:2,q:"State Kirchhoff's Voltage Law (KVL).",h:"Walk once around a closed loop.",s:["2-MARK ANSWER: In any closed loop, the algebraic sum of all voltages (rises and drops) is zero. Sum of source voltages = sum of voltage drops.","UNDERSTANDING: Energy gained from sources equals energy used by resistors, so you return to the starting voltage after one full loop. This is conservation of energy.","Loop: +V source, current I through R1 and R2:\nV − I·R1 − I·R2 = 0"],a:"ΣV around a closed loop = 0.",mi:"Wrong sign for drops. Going along the current, a resistor is a drop (−IR).",sim:"A 24 V source feeds R1=4 Ω and R2=8 Ω in series. Write KVL and find I.",sa:"24 − 4I − 8I = 0 ⇒ I = 2 A."},
{id:3,m:1,tp:"Ohm's law & power",d:"Level 2",imp:"📌 Must Know",ty:"Numerical",mk:3,q:"A 12 V supply is connected across a 6 Ω resistor. Find the current, power and energy used in 1 hour.",h:"I = V/R, P = VI.",s:["Given: V=12 V, R=6 Ω, t=1 h. Find: I, P, E.","I = V/R = 12/6 = 2 A.","P = VI = 12×2 = 24 W.","E = P×t = 24 W × 1 h = 24 Wh = 0.024 kWh."],a:"I = 2 A, P = 24 W, E = 24 Wh",mi:"Mixing units of time (seconds vs hours).",sim:"20 V across 5 Ω: find I and P.",sa:"I = 4 A, P = 80 W."},
{id:4,m:1,tp:"Voltage & current division",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:3,q:"A 12 V source feeds 4 Ω and 8 Ω in series. Find the voltage across each resistor using the voltage division rule.",h:"V across R = V × R / (R1+R2).",s:["Given: V=12 V, R1=4 Ω, R2=8 Ω (series). Total R = 12 Ω.","V1 = 12 × 4/12 = 4 V.","V2 = 12 × 8/12 = 8 V.","Check: 4 + 8 = 12 V ✓."],a:"V(4Ω) = 4 V, V(8Ω) = 8 V",mi:"Using the other resistor in the numerator for voltage division.",sim:"30 V across 10 Ω and 20 Ω in series. Voltage across 20 Ω?",sa:"30×20/30 = 20 V."},
{id:5,m:1,tp:"Voltage & current division",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:3,q:"A 9 A current enters two parallel resistors 3 Ω and 6 Ω. Find the current in each.",h:"Current division: the OTHER resistor goes on top.",s:["I(3Ω) = 9 × 6/(3+6) = 6 A.","I(6Ω) = 9 × 3/(3+6) = 3 A.","Check: 6 + 3 = 9 A ✓. (Smaller resistor takes more current.)"],a:"I(3Ω) = 6 A, I(6Ω) = 3 A",mi:"Using the same resistor on top (that is the voltage-division pattern).",sim:"12 A splits between 4 Ω and 12 Ω. Find each current.",sa:"I(4Ω) = 12×12/16 = 9 A; I(12Ω) = 3 A."},
{id:6,m:1,tp:"KVL",d:"Level 2",imp:"⭐ High Priority",ty:"Find the mistake",mk:2,q:"A student writes KVL for a series loop (source V, R1, R2, current I) as:  V − I·R1 + I·R2 = 0.  What is wrong?",h:"Both resistors carry the same current in the same direction.",s:["Both R1 and R2 are in the loop, with I flowing through each in the loop direction. So both are voltage DROPS.","A drop is written with a minus sign: −I·R1 and −I·R2.","Correct: V − I·R1 − I·R2 = 0."],a:"Sign of I·R2 is wrong. Correct: V − IR1 − IR2 = 0.",mi:"Treating a resistor as a source. Resistors never give a rise when you go along the current.",sim:"Write KVL for a 10 V source with R1=2 Ω, R2=3 Ω and find I.",sa:"10 − 2I − 3I = 0 ⇒ I = 2 A."},
{id:7,m:1,tp:"Star-delta",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:4,q:"Convert a delta network with R = 30 Ω in each arm to an equivalent star network.",h:"Star arm = (product of the two adjacent delta arms) / (sum of all three).",s:["Delta → Star: R_a = (R_ab × R_ca)/(R_ab+R_bc+R_ca).","R_star = (30×30)/(30+30+30) = 900/90 = 10 Ω.","Same for all three arms."],a:"Star: 10 Ω each (a balanced delta gives star = R_delta/3)",mi:"Dividing by only two resistors, or using the wrong adjacent arms.",sim:"Convert a balanced star of 5 Ω per arm to delta.",sa:"R_delta = 3 × R_star = 15 Ω each."},
{id:8,m:1,tp:"Mesh analysis",d:"Level 3",imp:"🔥 Core method",ty:"Circuit Analysis",mk:6,q:"Two meshes share a 4 Ω resistor.\nMesh 1: 10 V source, 2 Ω, and the shared 4 Ω.\nMesh 2: the shared 4 Ω and a 2 Ω resistor (no source).\nBoth mesh currents I1, I2 flow clockwise. Find I1, I2 and the current in the 4 Ω.",h:"Write one KVL equation per mesh. In the shared resistor, use (I1 − I2).",s:["Method: two independent loops ⇒ mesh analysis. I1 in mesh 1, I2 in mesh 2, both clockwise. Why: each KVL equation says 'voltage gained = voltage dropped' in that loop.","Mesh 1: 10 = 2·I1 + 4(I1 − I2) ⇒ 6I1 − 4I2 = 10.","Mesh 2: 0 = 4(I2 − I1) + 2·I2 ⇒ −4I1 + 6I2 = 0 ⇒ I2 = (2/3)I1.","Substitute: 6I1 − (8/3)I1 = 10 ⇒ (10/3)I1 = 10 ⇒ I1 = 3 A. I2 = 2 A.","Current in 4 Ω = I1 − I2 = 1 A (direction of I1).","Check mesh 1: 2·3 + 4·1 = 10 ✓. Mesh 2: 4(2−3) + 2·2 = 0 ✓."],a:"I1 = 3 A, I2 = 2 A, current in 4 Ω = 1 A",mi:"Forgetting that the shared resistor carries the DIFFERENCE of mesh currents.",sim:"Same layout: source 5 V, mesh-1 resistor 1 Ω, shared 3 Ω, mesh-2 resistor 3 Ω. Find I1, I2.",sa:"4I1 − 3I2 = 5 and −3I1 + 6I2 = 0 ⇒ I1 = 2 A, I2 = 1 A."},
{id:9,m:1,tp:"Nodal analysis",d:"Level 3",imp:"🔥 Core method",ty:"Circuit Analysis",mk:6,q:"A 10 V source in series with 2 Ω connects to node A. From node A, a 3 Ω and a 6 Ω resistor go to ground (0 V). Find the node voltage V_A and the source current.",h:"Apply KCL at node A: current in from source = currents out through 3 Ω and 6 Ω.",s:["Method: only one unknown node ⇒ nodal analysis. Ground = 0 V. Why KCL: current in = current out at A.","(V_A − 10)/2 + V_A/3 + V_A/6 = 0 (all currents leaving A, written as (V_A − V_other)/R).","Multiply by 6: 3(V_A − 10) + 2V_A + V_A = 0 ⇒ 6V_A = 30 ⇒ V_A = 5 V.","Source current = (10 − 5)/2 = 2.5 A.","Check: 5/3 + 5/6 = 2.5 A ✓."],a:"V_A = 5 V, source current = 2.5 A",mi:"Writing (10 − V_A)/2 in one term and (V_A − 10)/2 in others, mixing current directions.",sim:"12 V source with 2 Ω to node A; 4 Ω and 4 Ω from A to ground. Find V_A.",sa:"(V−12)/2 + V/4 + V/4 = 0 ⇒ V = 6 V."},
{id:10,m:1,tp:"Capacitor & inductor",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:3,q:"Find the energy stored in (a) a 10 μF capacitor charged to 100 V, (b) a 2 H inductor carrying 3 A.",h:"E = ½CV², E = ½LI².",s:["(a) E = ½ × 10×10⁻⁶ × 100² = ½ × 10⁻⁵ × 10⁴ = 0.05 J.","(b) E = ½ × 2 × 3² = 9 J."],a:"(a) 0.05 J  (b) 9 J",mi:"Using μF as F, or forgetting to square V or I.",sim:"20 μF at 50 V. Energy?",sa:"½×20×10⁻⁶×2500 = 0.025 J."},
{id:11,m:1,tp:"Magnetic circuit",d:"Level 3",imp:"⭐ High Priority",ty:"Numerical",mk:6,q:"An iron ring: mean length 0.5 m, area 4 cm², μr = 1000, coil of 500 turns carrying 1 A. Find reluctance, flux and flux density. (μ0 = 4π×10⁻⁷)",h:"Reluctance S = l/(μ0μrA). Flux = MMF/S.",s:["Given: l=0.5 m, A=4×10⁻⁴ m², μr=1000, N=500, I=1 A.","MMF = NI = 500 AT.","S = l/(μ0μrA) = 0.5/(4π×10⁻⁷×1000×4×10⁻⁴) = 0.5/(5.027×10⁻⁷) ≈ 9.95×10⁵ AT/Wb.","Φ = MMF/S = 500/9.95×10⁵ ≈ 5.03×10⁻⁴ Wb.","B = Φ/A = 5.03×10⁻⁴/4×10⁻⁴ ≈ 1.26 T."],a:"S ≈ 9.95×10⁵ AT/Wb, Φ ≈ 0.503 mWb, B ≈ 1.26 T",mi:"Using cm² directly: convert to m² (1 cm² = 10⁻⁴ m²).",sim:"l=0.4 m, A=5 cm², μr=800, N=200, I=1 A. Find Φ and B.",sa:"S≈7.96×10⁵; Φ≈2.51×10⁻⁴ Wb; B≈0.503 T."},
{id:12,m:2,tp:"Faraday & Lenz",d:"Level 1",imp:"📌 Must Know",ty:"Theory",mk:2,q:"State Faraday's laws and Lenz's law.",h:"One law about creation of EMF, one about its size, one about direction.",s:["FARADAY 1: When the flux linked with a coil changes, an EMF is induced in it.","FARADAY 2: The induced EMF = rate of change of flux linkage: e = N dΦ/dt.","LENZ: The induced EMF acts in a direction that opposes the change that produced it (hence e = −N dΦ/dt).","UNDERSTANDING: Push a magnet toward a coil; the coil's current makes a field that pushes the magnet back."],a:"e = −N dΦ/dt; the minus sign is Lenz's law.",mi:"Forgetting that the EMF opposes the change.",sim:"A coil of 100 turns has flux change 0.02 Wb in 0.1 s. Find average EMF.",sa:"e = 100×0.02/0.1 = 20 V."},
{id:13,m:2,tp:"Induced EMF",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:3,q:"A conductor of length 0.4 m moves at 10 m/s perpendicular to a field of 0.5 T. Find the induced EMF.",h:"Dynamically induced EMF e = Blv.",s:["Given: B=0.5 T, l=0.4 m, v=10 m/s.","e = B l v = 0.5×0.4×10 = 2 V."],a:"e = 2 V",mi:"Using the formula without sin θ when the motion is not perpendicular.",sim:"B=0.6 T, l=0.5 m, v=4 m/s. Find e.",sa:"0.6×0.5×4 = 1.2 V."},
{id:14,m:2,tp:"Inductance",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:3,q:"Two coils have L1 = 0.4 H, L2 = 0.9 H and mutual inductance M = 0.3 H. Find the coefficient of coupling.",h:"k = M/√(L1·L2).",s:["√(L1L2) = √(0.4×0.9) = √0.36 = 0.6 H.","k = 0.3/0.6 = 0.5."],a:"k = 0.5",mi:"Using L1+L2 in the denominator.",sim:"L1=0.5 H, L2=2 H, M=0.8 H. Find k.",sa:"√1 = 1; k = 0.8."},
{id:15,m:2,tp:"RMS, average, form factor",d:"Level 3",imp:"🔥 Core derivation",ty:"Derivation",mk:6,q:"For v = Vm sin ωt, derive the average value (half cycle), RMS value, form factor and peak factor.",h:"Integrate over 0 to π (half cycle for average) and use mean of squares for RMS.",s:["Average over half cycle: V_av = (1/π)∫₀^π Vm sinθ dθ = (Vm/π)[−cosθ]₀^π = (Vm/π)(2) = 2Vm/π ≈ 0.637Vm. (Full-cycle average is 0, so use half cycle.)","RMS = √[(1/2π)∫₀^2π Vm² sin²θ dθ]. Use sin²θ = (1−cos2θ)/2: mean = Vm²/2. So V_rms = Vm/√2 ≈ 0.707Vm.","Form factor = RMS/Average = 0.707Vm/0.637Vm ≈ 1.11.","Peak factor = Vm/RMS = √2 ≈ 1.414.","Why RMS: it gives the DC value that produces the same heating."],a:"V_av = 0.637Vm, V_rms = 0.707Vm, FF ≈ 1.11, PF ≈ 1.414",mi:"Taking the average over a full cycle (it is zero).",sim:"A sine wave has peak 100 V. Find average, RMS.",sa:"V_av = 63.7 V, V_rms = 70.7 V."},
{id:16,m:2,tp:"RMS, average, form factor",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:4,q:"For v = 141.4 sin(314t) volts, find Vm, V_rms, frequency, time period and half-cycle average.",h:"Compare with v = Vm sin ωt. f = ω/2π.",s:["Vm = 141.4 V, ω = 314 rad/s.","V_rms = 141.4/√2 = 100 V.","f = 314/(2π) ≈ 50 Hz. T = 1/f = 0.02 s.","V_av = 0.637×141.4 ≈ 90 V."],a:"Vm=141.4 V, Vrms=100 V, f=50 Hz, T=0.02 s, Vav≈90 V",mi:"Calling 314 the frequency instead of ω.",sim:"i = 14.14 sin(100πt) A. Find Irms, f, average.",sa:"Irms=10 A; f=50 Hz; Iav=0.637×14.14≈9.0 A."},
{id:17,m:2,tp:"Phasors",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:3,q:"Convert 3 + j4 to polar form and 10∠30° to rectangular form.",h:"r = √(a²+b²), θ = tan⁻¹(b/a); a = r cosθ, b = r sinθ.",s:["r = √(9+16) = 5; θ = tan⁻¹(4/3) = 53.13°. So 3+j4 = 5∠53.13°.","10∠30°: a = 10cos30° = 8.66; b = 10sin30° = 5."],a:"3+j4 = 5∠53.13°; 10∠30° = 8.66 + j5",mi:"Wrong quadrant for θ when a is negative.",sim:"Convert 6 − j8 to polar.",sa:"10∠−53.13°."},
{id:18,m:2,tp:"Series RL/RLC & power",d:"Level 3",imp:"🔥 Core method",ty:"Numerical",mk:6,q:"A series RL circuit has R = 30 Ω and X_L = 40 Ω across 200 V. Find Z, current, phase angle, power factor, P, Q and S.",h:"Z = √(R²+X²). P = VI cosφ.",s:["Given: R=30, XL=40, V=200 V.","Z = √(900+1600) = 50 Ω.","I = V/Z = 4 A.","φ = tan⁻¹(40/30) = 53.13° (current lags voltage).","pf = cosφ = R/Z = 0.6 lagging.","P = VI cosφ = 200×4×0.6 = 480 W. Q = VI sinφ = 640 VAR. S = VI = 800 VA.","Check: I²R = 16×30 = 480 W ✓."],a:"Z=50 Ω, I=4 A, φ=53.13° lag, pf=0.6, P=480 W, Q=640 VAR, S=800 VA",mi:"Adding R and X directly (Z = R + X is wrong).",sim:"R=6 Ω, XL=8 Ω, V=100 V. Find I, pf, P.",sa:"Z=10 Ω, I=10 A, pf=0.6 lag, P=600 W."},
{id:19,m:2,tp:"Series RL/RLC & power",d:"Level 3",imp:"⭐ High Priority",ty:"Numerical",mk:5,q:"A series RLC circuit has R = 10 Ω, X_L = 30 Ω, X_C = 20 Ω, V = 100 V. Find Z, I, phase angle, pf.",h:"Net reactance X = XL − XC.",s:["X = 30 − 20 = 10 Ω (inductive).","Z = √(10²+10²) = 14.14 Ω.","I = 100/14.14 = 7.07 A.","φ = tan⁻¹(10/10) = 45° lagging. pf = 0.707 lag."],a:"Z=14.14 Ω, I=7.07 A, φ=45° lag, pf=0.707",mi:"Adding XL and XC instead of subtracting.",sim:"R=8 Ω, XL=10 Ω, XC=4 Ω, V=100 V. Find Z, I, pf.",sa:"X=6; Z=10 Ω; I=10 A; pf=0.8 lag."},
{id:20,m:2,tp:"Reactance",d:"Level 2",imp:"📌 Must Know",ty:"Numerical",mk:3,q:"Find XL of a 0.1 H inductor and XC of a 100 μF capacitor at 50 Hz.",h:"XL = 2πfL, XC = 1/(2πfC).",s:["XL = 2π×50×0.1 = 31.42 Ω.","XC = 1/(2π×50×100×10⁻⁶) = 1/0.031416 = 31.83 Ω."],a:"XL = 31.42 Ω, XC = 31.83 Ω",mi:"Forgetting to convert μF to F.",sim:"XL of 0.2 H at 50 Hz?",sa:"62.83 Ω."},
{id:21,m:2,tp:"Three-phase",d:"Level 2",imp:"⭐ High Priority",ty:"Numerical",mk:4,q:"(a) A star-connected supply has line voltage 415 V. Find phase voltage. (b) A delta load has phase current 10 A. Find line current.",h:"Star: VL=√3Vph, IL=Iph. Delta: VL=Vph, IL=√3Iph.",s:["(a) Vph = 415/√3 = 239.6 ≈ 240 V.","(b) IL = √3 × 10 = 17.32 A."],a:"(a) ≈ 240 V  (b) 17.32 A",mi:"Applying √3 to the wrong quantity (voltage in star, current in delta).",sim:"Star with Vph = 230 V: find VL.",sa:"√3×230 ≈ 398 V."},
{id:22,m:2,tp:"R, L, C phase",d:"Level 2",imp:"📌 Must Know",ty:"Find the mistake",mk:2,q:"A student says: 'In a pure inductor, current leads voltage by 90°.' Correct this.",h:"ELI the ICE man.",s:["In a pure inductor, current LAGS voltage by 90° (ELI: voltage E leads current I in L).","In a pure capacitor, current LEADS voltage by 90° (ICE).","In a pure resistor, they are in phase."],a:"Inductor: current lags by 90°.",mi:"Swapping L and C behaviour.",sim:"What is the phase angle between v and i in a pure capacitor?",sa:"Current leads voltage by 90°."},
{id:23,m:1,tp:"Ohm's law",d:"Level 1",imp:"⭐ Must Know",ty:"Theory",mk:2,q:"Define current, voltage and resistance. State Ohm's law.",h:"Voltage pushes, resistance opposes, current flows.",s:["SIMPLE: Current = flow of charge (ampere). Voltage = the push that makes charge flow (volt). Resistance = opposition to the flow (ohm).","KEY FORMULA: V = IR, so I = V/R and R = V/I.","KEY POINTS: valid at constant temperature; the V–I graph of a resistor is a straight line; 1 Ω = 1 V/A."],ex:"Ohm's law: at constant temperature, the current through a conductor is directly proportional to the voltage across it, V = IR, where R is the resistance in ohms.",a:"V = IR (R constant at fixed temperature).",mi:"Applying Ohm's law to non-linear devices such as diodes.",sim:"Find R if 2 A flows when 10 V is applied.",sa:"R = 10/2 = 5 Ω."},
{id:24,m:1,tp:"Capacitor & inductor",d:"Level 1",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"Write the V–I relationships of a capacitor and an inductor and the energy each stores.",h:"Both depend on how FAST something changes.",s:["SIMPLE: A capacitor stores energy in an electric field; an inductor in a magnetic field. Capacitor current depends on how fast its voltage changes. Inductor voltage depends on how fast its current changes.","KEY FORMULAS: i = C dv/dt;  v = L di/dt;  E = ½CV²;  E = ½LI².","KEY POINTS: capacitor voltage cannot change instantly; inductor current cannot change instantly; in steady DC a capacitor is an open circuit and an inductor is a short circuit."],ex:"Capacitor: i = C dv/dt, energy ½CV² (joule). Inductor: v = L di/dt, energy ½LI² (joule).",a:"i = C dv/dt; v = L di/dt; E = ½CV²; E = ½LI².",mi:"Writing i = CV (that is charge Q = CV).",sim:"Why does a capacitor block steady DC?",sa:"dv/dt = 0 for constant voltage, so i = C dv/dt = 0."},
{id:25,m:1,tp:"Capacitor & inductor",d:"Level 2",imp:"📌 Important",ty:"Numerical",mk:3,q:"(a) A 5 μF capacitor's voltage rises uniformly from 0 to 10 V in 2 ms. Find the current. (b) A 0.2 H inductor's current rises uniformly from 0 to 5 A in 0.1 s. Find the voltage.",h:"Rate of change = change ÷ time.",s:["(a) dv/dt = 10/(2×10⁻³) = 5000 V/s. i = C dv/dt = 5×10⁻⁶ × 5000 = 0.025 A.","(b) di/dt = 5/0.1 = 50 A/s. v = L di/dt = 0.2 × 50 = 10 V."],ex:"i = C dv/dt = 25 mA; v = L di/dt = 10 V.",a:"(a) 25 mA  (b) 10 V",mi:"Forgetting to convert μF and ms to SI units.",sim:"2 μF, voltage rises 0 to 8 V in 4 ms. Find i.",sa:"2×10⁻⁶ × 2000 = 4 mA."},
{id:26,m:1,tp:"Mesh analysis",d:"Level 3",imp:"🔥 High Priority",ty:"Circuit Analysis",mk:5,q:"Mesh 1: 8 V source, 3 Ω, shared 2 Ω. Mesh 2: shared 2 Ω, 3 Ω, and a 1 V source that aids the clockwise current I2. Write the mesh equations in matrix form [R][I]=[V] and solve.",h:"Diagonal = total resistance in that mesh. Off-diagonal = −shared resistance.",s:["Method: two loops, both currents clockwise.","Mesh 1: 3I1 + 2(I1−I2) = 8 ⇒ 5I1 − 2I2 = 8.","Mesh 2: 3I2 + 2(I2−I1) = 1 ⇒ −2I1 + 5I2 = 1.","Matrix: [[5, −2],[−2, 5]] [I1; I2] = [8; 1].","Determinant = 25 − 4 = 21.","I1 = (8×5 + 2×1)/21 = 42/21 = 2 A.  I2 = (5×1 + 2×8)/21 = 21/21 = 1 A.","Check mesh 1: 5·2 − 2·1 = 8 ✓."],ex:"[5 −2; −2 5][I1; I2] = [8; 1] ⇒ I1 = 2 A, I2 = 1 A.",a:"I1 = 2 A, I2 = 1 A",mi:"Putting + instead of − for the shared resistor in the off-diagonal.",sim:"Solve [[4,−1],[−1,4]][I1;I2] = [5;10].",sa:"det=15; I1=(20+10)/15=2 A; I2=(40+5)/15=3 A."},
{id:27,m:1,tp:"Nodal analysis",d:"Level 3",imp:"🔥 High Priority",ty:"Circuit Analysis",mk:5,q:"A 5 A current source feeds node 1. Node 1 has 2 Ω to ground and a 4 Ω to node 2. Node 2 has 4 Ω to ground. Write the node equations in matrix form [G][V]=[I] and find V1, V2.",h:"Diagonal = sum of conductances at the node. Off-diagonal = −conductance between nodes.",s:["Conductances: 2 Ω → 1/2 S; 4 Ω → 1/4 S.","Node 1 (KCL): V1/2 + (V1−V2)/4 = 5 ⇒ 0.75V1 − 0.25V2 = 5.","Node 2 (KCL): (V2−V1)/4 + V2/4 = 0 ⇒ −0.25V1 + 0.5V2 = 0.","Matrix: [[0.75, −0.25],[−0.25, 0.5]] [V1; V2] = [5; 0].","From node 2: V1 = 2V2. Then 1.5V2 − 0.25V2 = 5 ⇒ V2 = 4 V, V1 = 8 V.","Check node 1: 8/2 + (8−4)/4 = 4 + 1 = 5 A ✓."],ex:"V1 = 8 V, V2 = 4 V.",a:"V1 = 8 V, V2 = 4 V",mi:"Forgetting to include the source current only on its own node's right-hand side.",sim:"7 A into node 1; 2 Ω node 1 to ground; 6 Ω between nodes; 6 Ω node 2 to ground. Find V1,V2.",sa:"Node 2 gives V1=2V2; node 1: V1/2+(V1−V2)/6 = 7V2/6 = 7 ⇒ V2=6 V, V1=12 V."},
{id:28,m:1,tp:"Magnetic circuit",d:"Level 3",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"A magnetic circuit has an iron path 0.4 m long (μr = 1000), cross-section 4 cm², and an air gap of 1 mm. Flux density is 1 T. Find the total MMF and the current if the coil has 1000 turns.",h:"Total MMF = iron AT + air gap AT. Use H = B/(μ0μr).",s:["Series circuit: same flux, MMFs add.","H(iron) = 1/(4π×10⁻⁷×1000) = 795.8 AT/m ⇒ AT(iron) = 795.8×0.4 = 318.3 AT.","H(air) = 1/(4π×10⁻⁷) = 7.958×10⁵ AT/m ⇒ AT(gap) = 7.958×10⁵×10⁻³ = 795.8 AT.","Total MMF = 318.3 + 795.8 = 1114.1 AT.","I = MMF/N = 1114.1/1000 = 1.114 A."],ex:"MMF = Σ Hl = 1114 AT; I = 1.11 A.",a:"MMF ≈ 1114 AT, I ≈ 1.11 A",mi:"Ignoring the air gap (it needs most of the MMF).",sim:"Same circuit with a 0.5 mm gap.",sa:"gap AT=397.9; total=716.2 AT; I=0.716 A."},
{id:29,m:1,tp:"Magnetic circuit",d:"Level 3",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"A magnetic circuit has two parallel limbs S1 = 4×10⁵ and S2 = 6×10⁵ AT/Wb, in series with S3 = 2.4×10⁵ AT/Wb. MMF = 1200 AT. Find the flux in each limb.",h:"Parallel reluctances combine like parallel resistors.",s:["S_par = (4×6×10¹⁰)/(10×10⁵) = 2.4×10⁵ AT/Wb.","Total S = 2.4×10⁵ + 2.4×10⁵ = 4.8×10⁵.","Φ3 = 1200/4.8×10⁵ = 2.5×10⁻³ Wb.","MMF across the parallel part = 2.5×10⁻³ × 2.4×10⁵ = 600 AT.","Φ1 = 600/4×10⁵ = 1.5 mWb; Φ2 = 600/6×10⁵ = 1.0 mWb. Check: 1.5+1.0 = 2.5 ✓."],ex:"Φ1 = 1.5 mWb, Φ2 = 1 mWb, central Φ = 2.5 mWb.",a:"Φ3 = 2.5 mWb, Φ1 = 1.5 mWb, Φ2 = 1 mWb",mi:"Adding parallel reluctances directly.",sim:"S1=S2=2×10⁵ in parallel, S3=1×10⁵ in series, MMF=800 AT. Find Φ3.",sa:"S=1×10⁵+1×10⁵=2×10⁵; Φ3=4 mWb (each limb 2 mWb)."},
{id:30,m:1,tp:"Magnetic circuit",d:"Level 1",imp:"📌 Important",ty:"Short Answer",mk:3,q:"Give the analogy between electric and magnetic circuits. Define MMF, reluctance, flux density.",h:"Voltage ↔ MMF, current ↔ flux, resistance ↔ reluctance.",s:["EMF ↔ MMF (NI, ampere-turns). Current ↔ flux Φ (Wb). Resistance ↔ reluctance S = l/(μA). Conductance ↔ permeance. I = V/R ↔ Φ = MMF/S.","Magnetic field strength H = NI/l (AT/m). Flux density B = Φ/A (tesla). B = μH.","Reluctance: opposition to flux, S = l/(μ0μrA)."],ex:"MMF = NI (AT); reluctance S = l/(μ0μrA) (AT/Wb); flux density B = Φ/A (T); Φ = MMF/S.",a:"Φ = MMF/S is the magnetic 'Ohm's law'.",mi:"Saying flux flows like current; it is only an analogy.",sim:"Find H for N=200, I=2 A, l=0.5 m.",sa:"H = 400/0.5 = 800 AT/m."},
{id:31,m:2,tp:"Induced EMF",d:"Level 1",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"Differentiate statically induced and dynamically induced EMF.",h:"Which part moves: the conductor or the flux?",s:["SIMPLE: Statically induced: the coil is fixed, but the flux through it changes with time (transformer). Dynamically induced: a conductor moves through a steady field and cuts the flux (generator).","KEY FORMULAS: static e = N dΦ/dt; dynamic e = B l v sinθ.","KEY POINTS: static includes self- and mutual-induced EMF; direction is found using Lenz's law (static) or Fleming's right-hand rule (dynamic)."],ex:"Static EMF: coil stationary, flux changes (e = N dΦ/dt). Dynamic EMF: conductor moves in a steady field (e = Blv sinθ).",a:"Static: flux changes. Dynamic: conductor cuts flux.",mi:"Using e = Blv when the flux is simply changing.",sim:"Which type is induced in a transformer secondary?",sa:"Statically (mutually) induced EMF."},
{id:32,m:2,tp:"Inductance",d:"Level 2",imp:"📌 Important",ty:"Numerical",mk:3,q:"A coil of 500 turns links a flux of 2 mWb when it carries 4 A. Find its self-inductance and the energy stored.",h:"L = NΦ/I; E = ½LI².",s:["Given: N=500, Φ=2×10⁻³ Wb, I=4 A.","L = NΦ/I = 500×2×10⁻³/4 = 0.25 H.","E = ½LI² = ½×0.25×16 = 2 J."],ex:"L = NΦ/I = 0.25 H; E = ½LI² = 2 J.",a:"L = 0.25 H, E = 2 J",mi:"Using mWb as Wb.",sim:"N=200, Φ=1.5 mWb, I=2 A. Find L.",sa:"L = 200×1.5×10⁻³/2 = 0.15 H."},
{id:33,m:2,tp:"AC generation",d:"Level 2",imp:"📌 Important",ty:"Derivation",mk:5,q:"Explain how a sinusoidal EMF is generated and derive e = Em sin ωt.",h:"Rotating coil in a uniform field; flux linkage = NBA cos ωt.",s:["A coil of N turns, area A rotates at angular speed ω in a uniform field B.","When the coil plane is perpendicular to B at t = 0, flux linkage = NBA cos ωt.","e = −d(NBA cos ωt)/dt = NBAω sin ωt.","So e = Em sin ωt with Em = NBAω. Frequency f = ω/2π."],ex:"A coil rotating in a uniform magnetic field gives e = NBAω sin ωt = Em sin ωt.",a:"e = Em sin ωt, Em = NBAω",mi:"Mixing up ω (rad/s) and f (Hz).",sim:"N=100, B=0.5 T, A=0.02 m², ω=100 rad/s. Find Em.",sa:"Em = 100×0.5×0.02×100 = 100 V."},
{id:34,m:2,tp:"Series RC",d:"Level 3",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"A series RC circuit has R = 8 Ω, XC = 6 Ω on 100 V. Find Z, I, phase angle, power factor and power.",h:"Z = √(R²+XC²). In RC the current leads voltage.",s:["Z = √(64+36) = 10 Ω.","I = 100/10 = 10 A.","φ = tan⁻¹(6/8) = 36.87°, current LEADS.","pf = R/Z = 0.8 leading.","P = I²R = 100×8 = 800 W (= VI cosφ = 100×10×0.8 ✓)."],ex:"Z=10 Ω, I=10 A, φ=36.87° (leading), pf=0.8 lead, P=800 W.",a:"Z=10 Ω, I=10 A, pf=0.8 lead, P=800 W",mi:"Saying current lags in an RC circuit.",sim:"R=12 Ω, XC=16 Ω, V=200 V. Find I, pf, P.",sa:"Z=20; I=10 A; pf=0.6 lead; P=1200 W."},
{id:35,m:2,tp:"AC power",d:"Level 2",imp:"⭐ Must Know",ty:"Numerical",mk:4,q:"A load takes 10 A from a 230 V supply at a power factor 0.866 lagging (φ = 30°). Find S, P and Q. Define each.",h:"S = VI; P = VI cosφ; Q = VI sinφ.",s:["S = VI = 230×10 = 2300 VA (apparent power).","P = VI cosφ = 2300×0.866 = 1992 W (active power, does real work).","Q = VI sinφ = 2300×0.5 = 1150 VAR (reactive power, shuttles between source and L/C).","Check: S² = P² + Q² ⇒ 1992² + 1150² ≈ 2300² ✓."],ex:"S = 2300 VA, P ≈ 1992 W, Q = 1150 VAR; power factor = cosφ = P/S.",a:"S = 2300 VA, P ≈ 1992 W, Q = 1150 VAR",mi:"Giving all three units as watts.",sim:"100 V, 5 A, pf 0.8. Find S, P, Q.",sa:"S=500 VA; P=400 W; Q=300 VAR."},
{id:36,m:2,tp:"Three-phase",d:"Level 1",imp:"📌 Important",ty:"Short Answer",mk:3,q:"What is a three-phase AC system? Give the star and delta relationships.",h:"Three equal voltages, 120° apart.",s:["SIMPLE: Three voltages of equal size and frequency, each displaced by 120° from the next (phases R, Y, B).","Star: VL = √3 Vph, IL = Iph.  Delta: VL = Vph, IL = √3 Iph.","KEY POINTS: balanced load takes equal current in each phase; star gives a neutral point."],ex:"A three-phase system has three equal EMFs 120° apart. Star: VL=√3Vph, IL=Iph. Delta: VL=Vph, IL=√3Iph.",a:"Star: VL=√3Vph. Delta: IL=√3Iph.",mi:"Applying √3 to the wrong quantity.",sim:"Phase angle between two phases?",sa:"120°."},
{id:37,m:2,tp:"Phasors",d:"Level 2",imp:"📌 Important",ty:"Numerical",mk:3,q:"Find (a) (3+j4)+(1−j2); (b) (2∠30°)×(3∠20°).",h:"Add in rectangular form; multiply in polar form.",s:["(a) Real: 3+1 = 4; imaginary: 4−2 = 2 ⇒ 4 + j2.","(b) Multiply magnitudes: 2×3 = 6; add angles: 30°+20° = 50° ⇒ 6∠50°."],ex:"(a) 4 + j2   (b) 6∠50°",a:"(a) 4 + j2  (b) 6∠50°",mi:"Multiplying angles instead of adding.",sim:"(5∠60°) ÷ (2∠20°)?",sa:"2.5∠40° (divide magnitudes, subtract angles)."},
{id:38,m:2,tp:"Series RL/RLC & power",d:"Level 3",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"A series circuit has R = 30 Ω, XL = 60 Ω, XC = 20 Ω across 200 V. Find Z, I, the voltage across each element, pf and P.",h:"Net reactance X = XL − XC. VR = IR, VL = I·XL, VC = I·XC.",s:["X = 60−20 = 40 Ω.","Z = √(30²+40²) = 50 Ω.  I = 200/50 = 4 A.","VR = 4×30 = 120 V; VL = 4×60 = 240 V; VC = 4×20 = 80 V.","pf = R/Z = 0.6 lagging. P = I²R = 16×30 = 480 W.","Check: √(120² + (240−80)²) = √(14400+25600) = 200 V ✓. Note VL and VC can exceed the supply voltage."],ex:"Z=50 Ω, I=4 A, VR=120 V, VL=240 V, VC=80 V, pf=0.6 lag, P=480 W.",a:"Z=50 Ω, I=4 A, VR=120 V, VL=240 V, VC=80 V, pf=0.6 lag, P=480 W",mi:"Adding VR+VL+VC arithmetically (they are phasors).",sim:"R=6 Ω, XL=12 Ω, XC=4 Ω, V=50 V. Find I, VR, VL, VC.",sa:"Z=10; I=5 A; VR=30 V; VL=60 V; VC=20 V."},
{id:39,m:1,tp:"KCL",d:"Level 2",imp:"⭐ Must Know",ty:"Circuit Analysis",mk:3,q:"At a node, 5 A and 2 A enter, while 3 A and I4 leave. Find I4 using KCL.",h:"Sum entering = sum leaving.",s:["Given: in = 5, 2 A; out = 3 A, I4.","KCL: 5 + 2 = 3 + I4.","I4 = 7 − 3 = 4 A (leaving)."],ex:"ΣI(in) = ΣI(out): 7 = 3 + I4 ⇒ I4 = 4 A.",a:"I4 = 4 A",mi:"Subtracting the entering currents from each other.",sim:"At a node 10 A enters; 4 A and I leave. Find I.",sa:"I = 6 A."},
{id:40,m:1,tp:"KVL",d:"Level 2",imp:"⭐ Must Know",ty:"Circuit Analysis",mk:4,q:"A loop has a 24 V source (driving the current clockwise), 3 Ω, an opposing 6 V source, and 3 Ω. Find the current using KVL.",h:"Going around the loop: sources that help = +, opposing = −, resistors = −IR.",s:["Loop (clockwise, current I):\n  +24 V ──3 Ω──(6 V opposing)──3 Ω──┘","KVL: 24 − 3I − 6 − 3I = 0.","18 = 6I ⇒ I = 3 A.","Check: drops 9 + 9 = 18 V = 24 − 6 ✓."],ex:"24 − 3I − 6 − 3I = 0 ⇒ I = 3 A.",a:"I = 3 A",mi:"Adding the 6 V instead of subtracting it.",sim:"30 V source with an opposing 10 V source, 2 Ω and 3 Ω in series. Find I.",sa:"30 − 10 − 5I = 0 ⇒ I = 4 A."}
];
const TOP=[1,2,23,4,5,6,39,40,7,8,26,9,27,28,15,12,18,19,34,35];
let pi=0;
const PLAN=[["Day 1","Theory basics + Ohm",[1,2,3,4,5]],["Day 2","Circuit rules",[6,7,10,8,9]],["Day 3","Magnetic + induction",[11,12,13,14,20]],["Day 4","AC waveforms",[15,16,17,22,21]],["Day 5","AC circuits",[18,19]]];
const SHEET=`DC: V=IR, P=VI=I²R=V²/R. Voltage division: V1=V·R1/(R1+R2). Current division: I1=I·R2/(R1+R2).
KCL: ΣI(in)=ΣI(out). KVL: ΣV in a loop = 0.
STAR↔DELTA: Rstar = (product of 2 adjacent delta arms)/(sum of delta arms). Balanced: Rstar=Rdelta/3.
MESH: one clockwise current per loop; write KVL per loop; shared R carries (I1−I2).
NODAL: choose ground; KCL at each node: Σ(V_node−V_neighbour)/R = 0.
ENERGY: C: ½CV², L: ½LI².
MAGNETIC: MMF=NI; S=l/(μ0μrA); Φ=MMF/S; B=Φ/A; permeance=1/S.
INDUCTION: e=−NdΦ/dt; e=Blv (dynamic). k=M/√(L1L2).
AC: ω=2πf; T=1/f; Vrms=Vm/√2; Vav(half)=2Vm/π; FF=1.11; PF(peak)=1.414.
Reactance: XL=2πfL; XC=1/(2πfC). Z=√(R²+(XL−XC)²). pf=R/Z=cosφ.
POWER: P=VIcosφ (W); Q=VIsinφ (VAR); S=VI (VA); S²=P²+Q².
THREE-PHASE: Star: VL=√3Vph, IL=Iph. Delta: VL=Vph, IL=√3Iph.`;
let tab="start",S={};try{S=JSON.parse(localStorage.getItem("g104")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("g104",JSON.stringify(S))}catch(e){}};
const st=id=>S[id]||(S[id]={att:0,ok:0,need:0}),$=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function nav(){const n=document.getElementById("nav");n.innerHTML="";[["start","Start here"],["top","⭐ Top"],["prac","Practice"],["1","Module 1"],["2","Module 2"],["sheet","Quick Sheet"],["rev","Revision"],["prog","Progress"]].forEach(([k,l])=>{const b=$("button",tab==k?"on":"",l);b.onclick=()=>{tab=k;render()};n.append(b)})}
function flash(t){const e=$("div","note",t);document.getElementById("app").prepend(e);setTimeout(()=>e.remove(),1500)}
function card(q){const c=$("div","card"),s=st(q.id);let step=0;
c.innerHTML=`<span class="tag">${q.tp}</span><span class="tag">${q.d}</span><span class="tag">${q.imp}</span><span class="tag">${q.ty}</span><span class="tag">${q.mk} marks</span><div class="q">Q${q.id}. ${esc(q.q)}</div>`;
const out=$("div"),row=$("div","row");c.append(row,out);
const add=(l,f,cls)=>{const b=$("button",cls||"",l);b.onclick=f;row.append(b)};
add("💡 Hint",()=>out.append($("div","box",esc(q.h))));
add("👣 Step-by-step",()=>{if(step<q.s.length){out.append($("div","box",`<b>Step ${step+1}:</b> ${esc(q.s[step++])}`));s.att++;save()}});
add("📝 Exam answer",()=>out.append($("div","box",`<b>Exam answer:</b> ${esc(q.ex||q.a)}`)));
add("✅ Answer",()=>out.append($("div","box",`<b>Final answer:</b> ${esc(q.a)}\n<b>⚠ Common mistake:</b> ${esc(q.mi)}`)),"p");
add("🔁 Try similar",()=>{const w=$("div","box",`<b>Similar:</b> ${esc(q.sim)}\n`);const b=$("button","","Reveal answer");b.onclick=()=>{w.append($("div","",`<b>Answer:</b> ${esc(q.sa)}`));b.remove()};w.append(b);out.append(w)});
add("✔ I got it",()=>{s.ok++;s.att++;s.need=0;save();flash("Marked understood")});
add("❌ Need practice",()=>{s.need=(s.need||0)+1;s.att++;save();flash("Added to revision list")});
return c}
function status(tp){const qs=Q.filter(q=>q.tp==tp);let a=0,o=0,n=0;qs.forEach(q=>{const s=st(q.id);a+=s.att;o+=s.ok;n+=s.need});if(!a)return"⚪ Not started";if(n)return"🔴 Weak";return o>=qs.length?"🟢 Strong":"🟡 Needs Practice"}
function render(){nav();const a=document.getElementById("app");a.innerHTML="";
if(tab=="start"){let h=`<h3>START HERE</h3><p class="note"><b>Syllabus note:</b> topics follow your brief for the KTU 2024 GXEST104 syllabus. I have not verified them against the official document. Thevenin, Norton and Max Power Transfer are deliberately NOT included. Which modules are in Series 1 must be confirmed with CET faculty. Practice questions are created for preparation, not past papers.</p>`;PLAN.forEach(([d,t,ids])=>h+=`<p><b>${d} — ${t}:</b> Q${ids.join(", Q")}</p>`);h+=`<p class="note">Tip: Hint → Step-by-step → Answer → Try similar. Mark ✔ or ❌ honestly.</p>`;a.append($("div","card",h))}
else if(tab=="1"||tab=="2"){Q.filter(q=>q.m==+tab).forEach(q=>a.append(card(q)))}
else if(tab=="top"){a.append($("div","card note","⭐ MUST KNOW — high-priority preparation list, not a prediction of the paper."));TOP.forEach(i=>a.append(card(Q.find(q=>q.id==i))))}
else if(tab=="prac"){const L=Q.filter(q=>!(st(q.id).ok>0&&!st(q.id).need)).sort((x,y)=>x.d.localeCompare(y.d)||x.id-y.id);if(!L.length){a.append($("div","card","All questions mastered 🎉"))}else{pi=pi%L.length;a.append($("div","card note",`Practice flow: easy → exam. Question ${pi+1} of ${L.length} not yet mastered.`));a.append(card(L[pi]));const b=$("button","p","Next question ▶");b.onclick=()=>{pi++;render()};a.append(b)}}
else if(tab=="sheet")a.append($("div","card","<h3>⚡ Quick Revision Sheet</h3><pre>"+esc(SHEET)+"\nCOMMON MISTAKES: units (μF, mWb, cm²) · KVL signs · shared resistor in mesh · √3 on wrong quantity · XL−XC not XL+XC · average over full cycle = 0.</pre>"));
else if(tab=="rev"){weak(a);const l=Q.filter(q=>st(q.id).need);l.length?l.forEach(q=>a.append(card(q))):a.append($("div","card","Nothing marked yet."))}
else{weak(a);let t=0,o=0;Q.forEach(q=>{t+=st(q.id).att;o+=st(q.id).ok});const c=(f)=>Q.filter(f).length;let h=`<h3>Master Q&A summary</h3><p>Total ${Q.length} · Module 1: ${c(q=>q.m==1)} · Module 2: ${c(q=>q.m==2)} · ⭐ Must Know: ${c(q=>q.imp.includes("Must"))} · Exam-level (Level 3): ${c(q=>q.d=="Level 3")}</p><p>By type: ${[...new Set(Q.map(q=>q.ty))].map(y=>y+" "+c(q=>q.ty==y)).join(" · ")}</p><h3>Progress</h3><p>Attempts: ${t} · Understood: ${o} · Accuracy: ${t?Math.round(100*o/t):0}%</p>`;[1,2].forEach(m=>{const mq=Q.filter(q=>q.m==m);h+=`<div>Module ${m}: ${mq.filter(q=>st(q.id).ok).length}/${mq.length} mastered</div>`});h+="<br>";[...new Set(Q.map(q=>q.tp))].forEach(tp=>h+=`<div>${status(tp)} — ${tp}</div>`);const cd=$("div","card",h),b=$("button","","Reset");b.onclick=()=>{S={};save();render()};cd.append(b);a.append(cd)}}
function weak(a){const bad={};Q.forEach(q=>{bad[q.tp]=(bad[q.tp]||0)+(st(q.id).need||0)});const tp=Object.keys(bad).find(k=>bad[k]>=2);if(!tp)return;let c=Q.filter(q=>q.tp==tp&&!st(q.id).ok).sort((x,y)=>(st(x.id).need||0)-(st(y.id).need||0));const m=Q.find(q=>q.tp==tp).m;if(!c.length||st(c[0].id).need)c=Q.filter(q=>q.m==m&&q.tp!=tp&&!st(q.id).ok).concat(c);if(!c.length)return;a.append($("div","card","<b>📍 You need more practice in "+esc(tp)+".</b> Try this next question:"));a.append(card(c[0]))}
render();
</script></body></html>
