<script>
// ---------- Flowchart diagrams (inline SVG, offline) ----------
const svg=(b,h)=>`<svg viewBox="0 0 400 ${h||200}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>${b}</svg>`;
const T=(x,y,t)=>`<text x="${x}" y="${y+4}" text-anchor="middle">${t}</text>`;
const OV=(x,y,t)=>`<rect class="a" x="${x-35}" y="${y-12}" width="70" height="24" rx="12"/>${T(x,y,t)}`;
const BX=(x,y,t,w)=>{w=w||110;return `<rect class="a" x="${x-w/2}" y="${y-12}" width="${w}" height="24"/>${T(x,y,t)}`};
const IO=(x,y,t)=>`<polygon class="a" points="${x-42},${y-12} ${x+58},${y-12} ${x+42},${y+12} ${x-58},${y+12}"/>${T(x,y,t)}`;
const DI=(x,y,t)=>`<polygon class="a" points="${x},${y-20} ${x+55},${y} ${x},${y+20} ${x-55},${y}"/>${T(x,y,t)}`;
const AR=d=>`<path class="a" d="${d}" marker-end="url(#ah)"/>`;
const DG={
sym:["Standard flowchart symbols","Observe: oval = start/end; parallelogram = input/output; rectangle = process (calculation/assignment); diamond = decision (Yes/No or True/False); arrows show flow direction; small circle = connector.",svg(OV(50,25,"Start / End")+IO(165,25,"Input/Output")+BX(290,25,"Process",90)+DI(60,90,"Decision?")+`<circle class="a" cx="190" cy="90" r="10"/>`+T(190,95,"A")+AR("M240 90H320")+T(60,140,"Terminator")+T(165,140,"Parallelogram")+T(290,140,"Rectangle")+T(60,125,"Diamond")+T(190,125,"Connector")+T(280,108,"Flow line"),160)],
f1:["Flowchart: larger of two numbers","Observe: one decision diamond with two exits (Yes / No) that join again at End. Draw: Start, Read a b, a > b ?, Print a / Print b, End.",svg(OV(200,14,"Start")+AR("M200 26V43")+IO(200,55,"Read a, b")+AR("M200 67V83")+DI(200,103,"a &gt; b ?")+AR("M145 103H80V138")+T(115,97,"Yes")+AR("M255 103H320V138")+T(285,97,"No")+IO(80,150,"Print a")+IO(320,150,"Print b")+`<path class="a" d="M80 162V200H165M320 162V200H235"/>`+OV(200,200,"End"),225)],
f2:["Flowchart: sum of 1 to n (loop)","Observe: the decision at the top controls repetition. While i ≤ n (Yes) the body runs and the flow line goes back to the decision; when No, print the result.",svg(OV(200,12,"Start")+AR("M200 24V35")+BX(200,47,"sum = 0, i = 1",130)+AR("M200 59V72")+DI(200,92,"i &lt;= n ?")+AR("M200 112V127")+T(212,121,"Yes")+BX(200,139,"sum = sum + i",130)+AR("M200 151V162")+BX(200,174,"i = i + 1",130)+AR("M200 186V196H70V92H145")+AR("M255 92H330V128")+T(292,86,"No")+IO(330,140,"Print sum")+AR("M330 152V166")+OV(330,178,"End"),210)]};
const Q=[
{id:1,m:1,tp:"Problem solving",d:"Easy",imp:"⭐ Must Know",ty:"Concept",mk:3,q:"List and explain the steps of the problem-solving process.",h:"From understanding the problem to maintaining the solution.",k:"Define → analyse → design → implement → test → document.",s:["1. Define/understand the problem: what is asked?","2. Analyse: inputs, outputs, constraints, conditions.","3. Design the algorithm: pseudocode or flowchart.","4. Implement: write the program (Python).","5. Test and debug using sample and edge cases.","6. Document and maintain. (Check the exact wording used in your class notes; the order is what matters.)"],a:"Define → Analyse → Design algorithm → Code → Test/Debug → Document.",ex:"Steps: (1) understand the problem, (2) analyse inputs/outputs, (3) design algorithm (pseudocode/flowchart), (4) implement in a language, (5) test and debug, (6) document and maintain.",mi:"Starting to code before analysing inputs and outputs.",sim:"In which step would you draw a flowchart?",sa:"Design the algorithm."},
{id:2,m:1,tp:"Strategies",d:"Easy",imp:"⭐ Must Know",ty:"Distinguish",mk:4,q:"Explain trial and error, heuristics, means-ends analysis and backtracking with one example each.",h:"One-line idea for each, then an example.",k:"Four ways to search for a solution.",s:["Trial and error: try possible solutions one by one until one works. Example: trying keys on a lock. Simple but may be slow; no guarantee of efficiency.","Heuristics: a rule of thumb that gives a good (not always best) answer quickly. Example: always travel to the nearest unvisited city.","Means-ends analysis: compare the current state with the goal, choose an action that reduces the difference, repeat (use sub-goals). Example: planning a route step by step toward the destination.","Backtracking: build a solution step by step; if a dead end is reached, undo the last choice and try another. Example: solving a maze or Sudoku."],a:"Trial-and-error: try all. Heuristic: rule of thumb. Means-ends: reduce gap to goal. Backtracking: undo at dead end.",ex:"Trial and error: try solutions until one works. Heuristics: rule-of-thumb for a good, fast answer. Means-ends analysis: reduce the difference between current and goal state. Backtracking: undo the last choice at a dead end and try another path (maze, Sudoku).",mi:"Confusing heuristics (rule of thumb) with trial and error (blind trying).",sim:"Which strategy returns to the last junction in a maze?",sa:"Backtracking."},
{id:3,m:1,tp:"Strategies",d:"Medium",imp:"🔥 High Priority",ty:"Method",mk:4,q:"Name the strategy used in each case:\n(a) trying every 3-digit PIN from 000 upward\n(b) always choosing the cheapest next step as a rule of thumb\n(c) repeatedly choosing an action that reduces the gap to the goal\n(d) undoing a move when a puzzle reaches a dead end",h:"Match each with the key phrase: all tries / rule of thumb / gap to goal / undo.",k:"Identify the clue word.",s:["(a) Trial and error: tries possibilities in sequence.","(b) Heuristic: a rule of thumb, no guarantee of the best answer.","(c) Means-ends analysis: reduce the difference between current state and goal.","(d) Backtracking: undo the last step at a dead end."],a:"(a) trial and error (b) heuristic (c) means-ends analysis (d) backtracking",ex:"(a) Trial and error (b) Heuristics (c) Means-ends analysis (d) Backtracking, with a one-line reason for each.",mi:"Calling (b) trial and error.",sim:"Solving N-queens by placing a queen and removing it when blocked: which strategy?",sa:"Backtracking."},
{id:4,m:1,tp:"Variables",d:"Easy",imp:"⭐ Must Know",ty:"Concept",mk:3,q:"Which of these are valid Python variable names? Give the rules.\n2x, my_var, class, total-1, _x, Total",h:"Check first character, allowed characters and keywords.",k:"Letters, digits, underscore; not starting with a digit; not a keyword.",s:["Rules: letters, digits and underscore only; must not start with a digit; no spaces or symbols such as -; cannot be a keyword (class, if, for...); names are case-sensitive.","Valid: my_var, _x, Total.","Invalid: 2x (starts with digit), class (keyword), total-1 (hyphen)."],a:"Valid: my_var, _x, Total. Invalid: 2x, class, total-1.",ex:"A variable name may contain letters, digits and _, must not begin with a digit, must not be a keyword and is case-sensitive. Valid: my_var, _x, Total.",mi:"Thinking Total and total are the same variable.",sim:"Is for_loop a valid name?",sa:"Yes (for_loop is not the keyword for)."},
{id:5,m:1,tp:"Data types",d:"Easy",imp:"⭐ Must Know",ty:"Output",mk:2,q:"Predict the output:",c:"print(type(5), type(5.0), type('5'), type(True))",o:"<class 'int'> <class 'float'> <class 'str'> <class 'bool'>",h:"Look at quotes and decimal points.",k:"int, float, str, bool.",s:["5 is an integer → int.","5.0 has a decimal point → float.","'5' is in quotes → str.","True → bool."],a:"<class 'int'> <class 'float'> <class 'str'> <class 'bool'>",ex:"Output: <class 'int'> <class 'float'> <class 'str'> <class 'bool'>. Quotes make a string; a decimal point makes a float.",mi:"Treating '5' as a number.",sim:"type(3/1)?",sa:"<class 'float'> (/ always gives a float)."},
{id:6,m:1,tp:"Operators",d:"Easy",imp:"⭐ Must Know",ty:"Output",mk:2,q:"Predict the output:",c:"print(7/2, 7//2, 7%2, 2**3)",o:"3.5 3 1 8",h:"/ true division, // floor division, % remainder, ** power.",k:"Arithmetic operators.",s:["7/2 = 3.5.","7//2 = 3 (floor division).","7%2 = 1 (remainder).","2**3 = 8."],a:"3.5 3 1 8",ex:"7/2 = 3.5, 7//2 = 3, 7%2 = 1, 2**3 = 8. Output: 3.5 3 1 8",mi:"Writing 3.5 for 7//2.",sim:"print(17//5, 17%5, 17/5)",sa:"3 2 3.4"},
{id:7,m:1,tp:"Precedence",d:"Medium",imp:"⭐ Must Know",ty:"Output",mk:4,q:"Predict the output:",c:"print(2+3*4**2/8-1)",o:"7.0",h:"Order: ** then * and / (left to right) then + and −.",k:"Precedence: (), **, * / // %, + −.",s:["4**2 = 16.","3*16 = 48.","48/8 = 6.0 (/ gives float).","2 + 6.0 − 1 = 7.0."],a:"7.0",ex:"4**2 = 16; 3*16 = 48; 48/8 = 6.0; 2 + 6.0 − 1 = 7.0. Output: 7.0",mi:"Evaluating strictly left to right (gives a wrong value) or writing 7.",sim:"print(2*3**2+4)",sa:"22"},
{id:8,m:1,tp:"Precedence",d:"Exam",imp:"🔥 High Priority",ty:"Output",mk:4,q:"Predict the output:",c:"print(-2**2, (-2)**2, 10-4-3, 2**3**2)",o:"-4 4 3 512",h:"** binds tighter than unary minus; ** is right-to-left.",k:"-2**2 = −(2**2). 2**3**2 = 2**(3**2).",s:["-2**2: ** first, so −(2²) = −4.","(-2)**2 = 4.","10−4−3: left to right, (10−4)−3 = 3.","2**3**2: right to left, 2**(3**2) = 2**9 = 512."],a:"-4 4 3 512",ex:"-2**2 = −4; (-2)**2 = 4; 10−4−3 = 3 (left to right); 2**3**2 = 2**9 = 512. Output: -4 4 3 512",mi:"Computing 2**3**2 as (2**3)**2 = 64.",sim:"print(8-3-2, 2**2**3)",sa:"3 256"},
{id:9,m:1,tp:"Precedence",d:"Medium",imp:"📌 Important",ty:"Output",mk:3,q:"Predict the output:",c:"print(5>3 and 2>4 or not False)",o:"True",h:"Order: not, then and, then or.",k:"not > and > or.",s:["5>3 is True; 2>4 is False; not False is True.","True and False = False.","False or True = True."],a:"True",ex:"(5>3 and 2>4) = False; not False = True; False or True = True. Output: True",mi:"Evaluating or before and.",sim:"print(True or False and False)",sa:"True (and is done first)."},
{id:10,m:1,tp:"Strings",d:"Medium",imp:"🔥 High Priority",ty:"Output",mk:4,q:"Predict the output:",c:"s = 'Python'\nprint(s[0], s[-1], s[1:4], len(s), s*2, s+'3')",o:"P n yth 6 PythonPython Python3",h:"Indexing starts at 0; slice end is excluded.",k:"s[a:b] gives positions a to b−1.",s:["s[0] = 'P'; s[-1] = last character = 'n'.","s[1:4] = positions 1,2,3 = 'yth'.","len(s) = 6.","s*2 repeats; s+'3' joins strings (no addition)."],a:"P n yth 6 PythonPython Python3",ex:"Output: P n yth 6 PythonPython Python3 (index from 0, slice end excluded, * repeats, + joins).",mi:"Including the end index in a slice.",sim:"s = 'Hello'; print(s[-2:])",sa:"lo"},
{id:11,m:1,tp:"Input & output",d:"Medium",imp:"⭐ Must Know",ty:"Output",mk:4,q:"If the user types 3 and then 4, predict the output:",c:"a = input()\nb = input()\nprint(a+b)\nprint(int(a)+int(b))",inp:["3","4"],o:"34\n7",h:"What type does input() return?",k:"input() always returns a string.",s:["a = '3', b = '4' (strings).","a+b joins strings: '34'.","int(a)+int(b) = 3 + 4 = 7."],a:"34 then 7",ex:"input() returns strings, so a+b = '34'. After conversion, int(a)+int(b) = 7. Output: 34 and 7 on separate lines.",mi:"Expecting 7 from a+b without int().",sim:"x = input() gets 5. What is x*2?",sa:"'55' (string repetition)."},
{id:12,m:1,tp:"Math module",d:"Medium",imp:"🔥 High Priority",ty:"Output",mk:4,q:"Predict the output:",c:"import math\nprint(math.sqrt(16), math.floor(3.7), math.ceil(3.2), math.pow(2,3), math.pi)",o:"4.0 3 4 8.0 3.141592653589793",h:"sqrt and pow return floats; floor and ceil return integers.",k:"import math, then math.function().",s:["math.sqrt(16) = 4.0.","math.floor(3.7) = 3; math.ceil(3.2) = 4.","math.pow(2,3) = 8.0 (float).","math.pi = 3.141592653589793."],a:"4.0 3 4 8.0 3.141592653589793",ex:"import math is needed. sqrt(16)=4.0, floor(3.7)=3, ceil(3.2)=4, pow(2,3)=8.0, pi=3.141592653589793.",mi:"Forgetting import math, or writing sqrt(16) without math.",sim:"math.sqrt(25)+math.ceil(1.2)",sa:"7.0"},
{id:13,m:1,tp:"Input & output",d:"Medium",imp:"📌 Important",ty:"Output",mk:3,q:"Predict the output:",c:"print('a','b',sep='-',end='!')\nprint('c')",o:"a-b!c",h:"end replaces the default newline.",k:"sep = separator, end = ending text.",s:["sep='-' puts '-' between items: a-b.","end='!' replaces the newline, so '!' is printed and the next print continues on the same line: c."],a:"a-b!c",ex:"First print gives a-b!, with no newline; second gives c. Output: a-b!c",mi:"Assuming a newline always follows print.",sim:"print('x','y','z')",sa:"x y z"},
{id:14,m:1,tp:"Math module",d:"Medium",imp:"🔥 High Priority",ty:"Program",mk:5,q:"Write a Python program to find the area of a circle of radius r. Show the result for r = 2, rounded to 2 decimals.",c:"import math\nr = 2\narea = math.pi * r**2\nprint(round(area, 2))",o:"12.57",h:"Area = πr². Use math.pi.",k:"Input → process → output.",s:["Given: r = 2. Find: area = πr².","Formula: math.pi * r**2.","Calculation: 3.14159... × 4 = 12.566...","round(area, 2) = 12.57."],a:"12.57 (program shown)",ex:"import math\nr = float(input())\narea = math.pi * r**2\nprint(round(area, 2))\nFor r = 2: 12.57",mi:"Writing math.pi * r*2 (that is πr·2, not πr²).",sim:"Volume of a sphere r = 3: (4/3)*math.pi*r**3 (1 decimal).",sa:"113.1"},
{id:15,m:1,tp:"Data types",d:"Exam",imp:"🔥 High Priority",ty:"Output",mk:4,q:"Predict the output:",c:"print(int(3.9), round(3.5), round(2.5), float(2), str(5)+'1')",o:"3 4 2 2.0 51",h:"int() cuts off decimals; round() rounds half to even.",k:"Type conversion.",s:["int(3.9) = 3 (truncates).","round(3.5) = 4; round(2.5) = 2 (Python rounds exact halves to the nearest even number).","float(2) = 2.0.","str(5)+'1' = '51'."],a:"3 4 2 2.0 51",ex:"int(3.9)=3, round(3.5)=4, round(2.5)=2, float(2)=2.0, str(5)+'1'='51'. Output: 3 4 2 2.0 51",mi:"Expecting round(2.5) = 3.",sim:"int(-3.9)",sa:"-3 (truncates toward zero)."},
{id:16,m:2,tp:"Algorithms & pseudocode",d:"Easy",imp:"⭐ Must Know",ty:"Concept",mk:3,q:"Define algorithm and pseudocode. Give the properties of a good algorithm.",h:"Step-by-step instructions; informal code.",k:"Algorithm = finite, ordered, unambiguous steps.",s:["Algorithm: a finite sequence of well-defined steps to solve a problem.","Properties: input, output, definiteness (each step clear), finiteness (it ends), effectiveness (steps are doable).","Pseudocode: an informal, language-independent, English-like description of an algorithm using words such as READ, IF, WHILE, PRINT.","Example: READ a, b → sum = a + b → PRINT sum."],a:"Algorithm: finite, definite steps. Pseudocode: informal outline of the algorithm.",ex:"An algorithm is a finite, ordered set of unambiguous steps that solves a problem (it has input, output, definiteness, finiteness, effectiveness). Pseudocode is an informal, language-independent way to write it using keywords like READ, IF, PRINT.",mi:"Writing real Python syntax and calling it pseudocode.",sim:"Write pseudocode to find the area of a rectangle.",sa:"READ length, breadth; area = length × breadth; PRINT area."},
{id:17,m:2,tp:"Sequencing & selection",d:"Medium",imp:"⭐ Must Know",ty:"Program",mk:5,q:"Write pseudocode and Python to find the largest of three numbers. Trace for 4, 9, 7.",c:"a, b, c = 4, 9, 7\nlargest = a\nif b > largest:\n    largest = b\nif c > largest:\n    largest = c\nprint(largest)",o:"9",h:"Assume the first is largest, then compare with the others.",k:"Selection with if.",s:["Pseudocode: READ a, b, c; largest = a; IF b > largest THEN largest = b; IF c > largest THEN largest = c; PRINT largest.","Trace: largest = 4; 9 > 4 → largest = 9; 7 > 9 false → stays 9.","Output: 9."],a:"9",ex:"largest = a; if b > largest: largest = b; if c > largest: largest = c; print(largest). For 4, 9, 7 the answer is 9.",mi:"Comparing b with c directly and forgetting to keep the current largest in a variable.",sim:"Largest of 5, 2, 8?",sa:"8"},
{id:18,m:2,tp:"Sequencing & selection",d:"Medium",imp:"⭐ Must Know",ty:"Output",mk:3,q:"Predict the output:",c:"marks = 72\nif marks >= 80:\n    print('A')\nelif marks >= 60:\n    print('B')\nelse:\n    print('C')",o:"B",h:"Python checks conditions top to bottom and stops at the first True.",k:"if – elif – else.",s:["72 >= 80 is False.","72 >= 60 is True → print B.","else is skipped."],a:"B",ex:"72 ≥ 80 false; 72 ≥ 60 true, so B is printed and the rest is skipped. Output: B",mi:"Forgetting the colon or the indentation.",sim:"marks = 55?",sa:"C"},
{id:19,m:2,tp:"Case structure",d:"Medium",imp:"📌 Important",ty:"Output",mk:4,q:"Python's usual way to write a case (multi-way) structure is an if-elif ladder. Predict the output:",c:"day = 3\nif day == 1:\n    print('Mon')\nelif day == 2:\n    print('Tue')\nelif day == 3:\n    print('Wed')\nelse:\n    print('Invalid')",o:"Wed",h:"Check each == in turn.",k:"Case structure ≈ if-elif-else ladder.",s:["day == 1 False; day == 2 False.","day == 3 True → print Wed.","else covers all other values (the 'default' case)."],a:"Wed",ex:"The case structure is implemented with if–elif–else; else works as the default. For day = 3 the output is Wed.",mi:"Using = instead of == in the conditions.",sim:"day = 5?",sa:"Invalid"},
{id:20,m:2,tp:"Sequencing & selection",d:"Exam",imp:"🔥 High Priority",ty:"Program",mk:5,q:"A year is a leap year if divisible by 400, or divisible by 4 but not by 100. What does this print?",c:"year = 2100\nif (year % 400 == 0) or (year % 4 == 0 and year % 100 != 0):\n    print('Leap')\nelse:\n    print('Not leap')",o:"Not leap",h:"Evaluate each condition for 2100.",k:"Combine conditions with and / or.",s:["2100 % 400 = 100 → False.","2100 % 4 = 0 → True; 2100 % 100 = 0 → (!= 0) False; so the and part is False.","False or False = False → Not leap."],a:"Not leap",ex:"2100 is not divisible by 400, and although divisible by 4 it is divisible by 100, so the condition is False. Output: Not leap",mi:"Testing only year % 4 == 0.",sim:"year = 2024?",sa:"Leap"},
{id:21,m:2,tp:"Loops",d:"Medium",imp:"⭐ Must Know",ty:"Output",mk:3,q:"Predict the output:",c:"for i in range(2, 10, 3):\n    print(i, end=' ')",o:"2 5 8",h:"range(start, stop, step): stop is excluded.",k:"range(2,10,3) → 2, 5, 8.",s:["Start 2, step 3: 2, 5, 8.","Next would be 11 ≥ 10, so stop.","end=' ' keeps the output on one line."],a:"2 5 8",ex:"range(2,10,3) generates 2, 5, 8; output: 2 5 8",mi:"Including the stop value.",sim:"for i in range(10,0,-3): print(i, end=' ')",sa:"10 7 4 1"},
{id:22,m:2,tp:"Loops",d:"Medium",imp:"🔥 High Priority",ty:"Trace",mk:4,q:"Trace and give the output:",c:"s = 0\nfor i in range(1, 5):\n    s += i * i\nprint(s)",o:"30",h:"Make a table of i and s.",k:"Trace table.",s:["i=1: s = 0+1 = 1.","i=2: s = 1+4 = 5.","i=3: s = 5+9 = 14.","i=4: s = 14+16 = 30. Loop ends (range stops before 5).","print(s) → 30."],a:"30",ex:"Trace: i=1→1, i=2→5, i=3→14, i=4→30. Output: 30",mi:"Running i up to 5 instead of 4.",sim:"Output if range(1,4)?",sa:"1 + 4 + 9 = 14."},
{id:23,m:2,tp:"Loops",d:"Medium",imp:"🔥 High Priority",ty:"Trace",mk:4,q:"Trace and give the output (factorial):",c:"n = 5\nf = 1\nwhile n > 1:\n    f *= n\n    n -= 1\nprint(f)",o:"120",h:"Does the loop condition get tested before the body?",k:"while tests first.",s:["n=5: f = 5, n = 4.","n=4: f = 20, n = 3.","n=3: f = 60, n = 2.","n=2: f = 120, n = 1.","n=1: condition false, stop. print(f) → 120."],a:"120",ex:"Trace: (n,f) = (5,5), (4,20), (3,60), (2,120), then n = 1 stops. Output: 120",mi:"Forgetting n -= 1 (infinite loop).",sim:"n = 4 gives?",sa:"24"},
{id:24,m:2,tp:"Repeat-until",d:"Exam",imp:"🔥 High Priority",ty:"Trace",mk:5,q:"Python has no native repeat-until. Show how repeat-until is written in Python and predict the output:",c:"n = 0\nwhile True:\n    n += 1\n    if n * n > 50:\n        break\nprint(n)",o:"8",h:"Repeat-until runs the body first, then tests the condition at the end.",k:"repeat-until → while True + if condition: break.",s:["Repeat-until: the body runs at least once; condition tested at the END; loop stops when the condition is TRUE.","while: condition tested at the START; loop continues while the condition is TRUE.","Python equivalent: while True: body; if condition: break.","Trace: n=1..7 gives n*n = 1..49 (not > 50); n=8 gives 64 > 50 → break.","Output: 8."],a:"8",ex:"Repeat-until: body first, test at the end, exit when condition is True. Python has no repeat-until, so use while True with if condition: break. Output: 8",mi:"Treating until condition as 'continue while condition'.",sim:"First n with n*n > 20?",sa:"5"},
{id:25,m:2,tp:"Loops",d:"Exam",imp:"📌 Important",ty:"Trace",mk:5,q:"Trace and give the output (sum of digits):",c:"n = 1234\ns = 0\nwhile n > 0:\n    s += n % 10\n    n //= 10\nprint(s)",o:"10",h:"n % 10 gives the last digit; n // 10 removes it.",k:"Digit extraction.",s:["n=1234: s = 4, n = 123.","n=123: s = 7, n = 12.","n=12: s = 9, n = 1.","n=1: s = 10, n = 0. Loop stops.","print(s) → 10."],a:"10",ex:"Trace: (s,n) = (4,123), (7,12), (9,1), (10,0). Output: 10",mi:"Using / instead of // (gives floats and never reaches 0 cleanly).",sim:"n = 905?",sa:"14"},
{id:26,m:2,tp:"Flowcharts",d:"Easy",imp:"⭐ Must Know",ty:"Diagram",mk:3,q:"Name the standard flowchart symbols and their uses.",h:"Oval, parallelogram, rectangle, diamond.",k:"Each shape has one job.",dg:["sym"],s:["Oval (terminator): Start and End.","Parallelogram: input and output (READ/PRINT).","Rectangle: process, such as calculations and assignments.","Diamond: decision with two exits (Yes/No).","Arrows show direction of flow; the small circle is a connector."],a:"Oval, parallelogram, rectangle, diamond, arrows, connector.",ex:"Oval – start/end; parallelogram – input/output; rectangle – process; diamond – decision; arrow – flow direction; circle – connector.",mi:"Using a rectangle for input/output.",sim:"Which symbol is used for 'x > 5 ?'",sa:"Diamond (decision)."},
{id:27,m:2,tp:"Flowcharts",d:"Medium",imp:"⭐ Must Know",ty:"Diagram",mk:4,q:"Draw a flowchart to read two numbers and print the larger.",h:"One decision diamond.",k:"Selection in a flowchart.",dg:["f1"],s:["Start (oval).","Read a, b (parallelogram).","Decision: a > b ? (diamond).","Yes → Print a. No → Print b (parallelograms).","Both paths join at End (oval)."],a:"See the flowchart: decision a > b with Yes/No branches.",ex:"Start → READ a, b → a > b ? → Yes: PRINT a / No: PRINT b → End. Label both branches.",mi:"Leaving a decision exit without a Yes/No label.",sim:"Which symbol follows Start in this flowchart?",sa:"Input parallelogram (Read a, b)."},
{id:28,m:2,tp:"Flowcharts",d:"Exam",imp:"🔥 High Priority",ty:"Diagram",mk:5,q:"Draw a flowchart for the sum of the numbers 1 to n, and write the matching Python.",c:"n = 4\nsum = 0\ni = 1\nwhile i <= n:\n    sum = sum + i\n    i = i + 1\nprint(sum)",o:"10",h:"The loop is a decision plus a flow line going back.",k:"Loop = decision + return arrow.",dg:["f2"],s:["Set sum = 0, i = 1.","Decision: i ≤ n? If Yes: sum = sum + i, then i = i + 1, and go back to the decision.","If No: print sum and stop.","For n = 4: sum = 1, 3, 6, 10. Output 10."],a:"10 (for n = 4)",ex:"Flowchart: Start → sum=0,i=1 → i<=n? → Yes: sum=sum+i; i=i+1 → back to decision. No: Print sum → End. Python: while i <= n loop.",mi:"Forgetting the return arrow to the decision, or i = i + 1.",sim:"Sum if n = 5?",sa:"15"},
{id:29,m:2,tp:"Debugging",d:"Medium",imp:"📌 Important",ty:"Mistake",mk:3,q:"Find the errors in this program and correct it:",c:"x = 5\nif x = 5\nprint('five')",h:"Look at the comparison, the colon and the indentation.",k:"Use ==, add a colon, indent the block.",s:["Error 1: = is assignment; the condition needs == for comparison.","Error 2: missing colon after the condition.","Error 3: the print line must be indented under the if.","Correct code: x = 5 / if x == 5: / (4 spaces) print('five') → output five."],a:"Use x == 5, add :, indent the print.",ex:"Errors: (1) = instead of ==; (2) missing colon; (3) missing indentation. Correct: if x == 5:  then an indented print('five').",mi:"Writing if x = 5.",sim:"Find the error: while n > 0 print(n)",sa:"Missing colon after the condition (and indentation of the body)."},

const QK=[["Which operator gives the remainder?","%"],["What does // do?","Floor division (7//2 = 3)"],["Type returned by input()?","str (always a string)"],["Which has higher precedence, ** or *?","** (then * / // %, then + −)"],["Is ** left- or right-associative?","Right-to-left: 2**3**2 = 512"],["Which symbol compares for equality?","== (not =)"],["Flowchart symbol for a decision?","Diamond"],["Flowchart symbol for input/output?","Parallelogram"],["Flowchart symbol for start/end?","Oval (terminator)"],["What does print() end with by default?","A newline (change with end=)"],["Does Python have a native repeat-until?","No: use while True with if condition: break"],["range(5) gives?","0, 1, 2, 3, 4"],["math.ceil(3.2)?","4"],["Which strategy undoes the last choice at a dead end?","Backtracking"]];
const SHEET=`MODULE 1
Steps: define → analyse → design → implement → test → document.
Strategies: trial & error (try all) · heuristics (rule of thumb) · means-ends (reduce gap to goal) · backtracking (undo at dead end).
Variables: letters, digits, _; no leading digit; not a keyword; case-sensitive.
Types: int, float, str, bool. type(x). Convert: int(), float(), str(). input() returns str.
Operators: + − * / (float) // (floor) % (remainder) ** (power).
Precedence: ( ) → ** (right-to-left) → unary − → * / // % → + − → comparisons → not → and → or.
Strings: s[0], s[-1], s[a:b] (b excluded), len(s), s*2, s+t.
Math: import math; math.sqrt, floor, ceil, pow, pi.
print(a, b, sep='-', end='!')
MODULE 2
Algorithm: finite, definite, effective steps with input and output. Pseudocode: informal English-like steps.
Selection: if / elif / else (colon + indentation). Case structure → if-elif ladder.
Loops: for i in range(start, stop, step) (stop excluded); while condition: (test first).
Repeat-until (test at end, stop when TRUE): while True: ... if cond: break.
Flowchart symbols: oval start/end · parallelogram I/O · rectangle process · diamond decision · arrows · connector.
MISTAKES: = vs == · missing colon · indentation · input() is str · round(2.5)=2 · 2**3**2 = 512 · wrong range end · forgetting n -= 1.`;
const TOP=[1,2,3,7,8,12,15,16,17,18,20,22,23,24,26,27,28];
// ---------- App ----------
let tab="top",S={},pi=0,mock=null,timer=null;try{S=JSON.parse(localStorage.getItem("g105")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("g105",JSON.stringify(S))}catch(e){}};
const st=id=>S[id]||(S[id]={att:0,ok:0,need:0}),$=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const RK=q=>q.imp.includes("Must")?0:q.imp.includes("High")?1:q.imp.includes("Important")?2:3;
const mastered=q=>st(q.id).ok>0&&!st(q.id).need;
const TABS=[["top","⭐ Top"],["must","Must Know"],["prac","🧠 Practice"],["quick","Quick Q"],["dia","Flowcharts"],["sheet","Quick Revision"],["qa","Master Q&A"],["prog","Progress"],["mock","Mock Test"]];
function nav(){const n=document.getElementById("nav");n.innerHTML="";TABS.forEach(([k,l])=>{const b=$("button",tab==k?"on":"",l);b.onclick=()=>{tab=k;render()};n.append(b)})}
function flash(t){const e=$("div","note",t);document.getElementById("app").prepend(e);setTimeout(()=>e.remove(),1600)}
function topicNeed(){const b={};Q.forEach(q=>{b[q.tp]=(b[q.tp]||0)+(st(q.id).need||0)});return b}
function weakTopic(){const b=topicNeed();return Object.keys(b).find(k=>b[k]>=1)}
function status(tp){const qs=Q.filter(q=>q.tp==tp);let a=0,o=0,n=0;qs.forEach(q=>{const s=st(q.id);a+=s.att;o+=s.ok;n+=s.need||0});if(!a)return"⚪ Not started";if(n)return"🔴 Weak";return o>=qs.length?"🟢 Strong":"🟡 Needs Practice"}
function next(){const tp=weakTopic();let c=[];if(tp)c=Q.filter(q=>q.tp==tp&&!mastered(q)&&!st(q.id).need);if(!c.length)c=sorted();return{tp,q:c[0]}}
function sorted(){return Q.filter(q=>!mastered(q)).sort((x,y)=>(st(y.id).need?1:0)-(st(x.id).need?1:0)||RK(x)-RK(y)||x.id-y.id)}
function dgBox(k){const d=DG[k];const w=$("div","box");w.innerHTML=`<b>${d[0]}</b>\n${d[2]}<div class="note">${esc(d[1])}</div>`;return w}
function card(q,nv){const c=$("div","card"),s=st(q.id);let step=0;
c.innerHTML=`<span class="tag">M${q.m}</span><span class="tag">${q.tp}</span><span class="tag">${q.d}</span><span class="tag">${q.imp}</span><span class="tag">${q.ty}</span><span class="tag">${q.mk} marks (suggested practice)</span><div class="q">Q${q.id}. ${esc(q.q)}</div>${q.c?'<pre class="code">'+esc(q.c)+"</pre>":""}`;
const out=$("div"),row=$("div","row");c.append(row,out);
const add=(l,f,cls)=>{const b=$("button",cls||"",l);b.onclick=f;row.append(b)};
add("🤔 Think",()=>out.append($("div","box","Pause. Try the question on paper (trace the code line by line) before using the hint.")));
add("💡 Hint",()=>out.append($("div","box",esc(q.h))));
add("🔑 Key concept",()=>out.append($("div","box",esc(q.k))));
if(q.dg)add("🖼 Diagram",()=>q.dg.forEach(k=>out.append(dgBox(k))));
add("👣 Explain",()=>{if(step<q.s.length){out.append($("div","box",`<b>Step ${step+1}:</b> ${esc(q.s[step++])}`));s.att++;save()}});
add("✅ Answer",()=>out.append($("div","box",`<b>Final answer:</b> ${esc(q.a)}\n<b>⚠ Common mistake:</b> ${esc(q.mi)}`)),"p");
add("📝 Exam answer",()=>out.append($("div","box",`<b>Write in the exam:</b> ${esc(q.ex)}`)));
add("🔁 Similar",()=>{const w=$("div","box",`<b>Similar:</b> ${esc(q.sim)}\n`);const b=$("button","","Reveal answer");b.onclick=()=>{w.append($("div","",`<b>Answer:</b> ${esc(q.sa)}`));b.remove()};w.append(b);out.append(w)});
add("✔ I got it",()=>{s.ok++;s.att++;s.need=0;save();flash("Marked understood")});
add("❌ Need practice",()=>{s.need=(s.need||0)+1;s.att++;save();flash("Added to revision list");const t=weakTopic();if(t)flash("You need more practice with "+t+" — see the Practice tab.")});
if(nv){add("◀ Prev",()=>{pi=Math.max(0,pi-1);render()});add("Next ▶",()=>{pi++;render()},"p")}
return c}
function render(){nav();clearInterval(timer);const a=document.getElementById("app");a.innerHTML="";
if(tab=="top"){a.append($("div","card note","⭐ High-priority preparation questions — not a prediction of the paper. Start here, in order."));TOP.forEach(i=>a.append(card(Q.find(q=>q.id==i))))}
else if(tab=="must"){Q.filter(q=>q.imp.includes("Must")).forEach(q=>a.append(card(q)))}
else if(tab=="prac"){const L=sorted();if(!L.length){a.append($("div","card","All questions mastered 🎉"));return}const n=next();if(n.tp)a.append($("div","card","<b>You need more practice with "+esc(n.tp)+".</b> Try the next question."));pi=Math.min(pi,L.length-1);a.append($("div","card note",`Need-practice first, then Must Know → High → others. Question ${pi+1} of ${L.length} unmastered.`));a.append(card(n.tp&&pi==0&&n.q?n.q:L[pi],1))}
else if(tab=="quick"){a.append($("div","card note","Rapid recall: answer in your head, then reveal."));QK.forEach(([q,an])=>{const c=$("div","card","<b>"+esc(q)+"</b>"),b=$("button","","Reveal");b.onclick=()=>{c.append($("div","box",esc(an)));b.remove()};const rw=$("div","row");rw.append(b);c.append(rw);a.append(c)})}
else if(tab=="dia"){a.append($("div","card note","Flowchart revision: standard symbols, larger-of-two (selection) and sum of 1..n (loop). Tip: redraw each one from memory."));Object.keys(DG).forEach(k=>a.append($("div","card",dgBox(k).innerHTML)))}
else if(tab=="sheet")a.append($("div","card","<h3>📌 Quick Revision</h3><pre>"+esc(SHEET)+"</pre>"));
else if(tab=="qa"){Q.forEach(q=>{const d=$("details","card");d.innerHTML=`<summary><b>Q${q.id}.</b> ${esc(q.q)}</summary>${q.c?'<pre class="code">'+esc(q.c)+"</pre>":""}<div class="box"><b>Answer:</b> ${esc(q.a)}\n<b>Exam answer:</b> ${esc(q.ex)}\n<b>Steps:</b>\n${q.s.map(esc).join("\n")}\n<b>Mistake:</b> ${esc(q.mi)}</div>`;a.append(d)})}
else if(tab=="mock"){mockView(a)}
else{let t=0,o=0,nd=0;Q.forEach(q=>{t+=st(q.id).att;o+=st(q.id).ok;nd+=st(q.id).need?1:0});const c=f=>Q.filter(f).length;
let h=`<h3>Master Q&A summary</h3><p>Total ${Q.length} · Module 1: ${c(q=>q.m==1)} · Module 2: ${c(q=>q.m==2)} · ⭐ Must Know ${c(q=>q.imp.includes("Must"))} · 🔥 High ${c(q=>q.imp.includes("High"))} · 📌 Important ${c(q=>q.imp.includes("Important"))}</p><p>Code-output/trace ${c(q=>q.o)} · Programs ${c(q=>q.ty=="Program")} · Flowcharts ${c(q=>q.dg)} · Concept/Distinguish ${c(q=>["Concept","Distinguish","Method"].includes(q.ty))}</p><h3>Progress</h3><p>Attempted steps ${t} · Understood ${o} · Need practice ${nd} · Mastered ${c(mastered)}/${Q.length}</p>`;
[1,2].forEach(m=>{const mq=Q.filter(q=>q.m==m);h+=`<div>Module ${m}: ${mq.filter(mastered).length}/${mq.length} mastered</div>`});h+="<br>";
[...new Set(Q.map(q=>q.tp))].forEach(x=>h+=`<div>${status(x)} — ${x}</div>`);
const nx=next();if(nx.q)h+=`<p><b>Recommended next:</b> Q${nx.q.id} (${esc(nx.q.tp)}) — open the Practice tab.</p>`;
const ms=S._mock||[];if(ms.length)h+=`<p><b>Mock scores:</b> ${ms.map(m=>m.s+"/"+m.n).join(", ")}</p>`;
const cd=$("div","card",h),b=$("button","","Reset progress");b.onclick=()=>{if(confirm("Reset all progress on this device?")){S={};save();render()}};cd.append(b);a.append(cd)}}
function mockView(a){const IDS=[2,3,7,8,12,18,20,22,24,27];
if(!mock){const c=$("div","card","<h3>Mock Test — practice set (format provisional)</h3><p class='note'>10 questions from the bank (output prediction, tracing and flowchart). Write answers on paper or in the boxes. Answers stay hidden until you finish. Not an official pattern.</p>");const b1=$("button","p","Start timed (30 min)"),b2=$("button","","Start untimed");b1.onclick=()=>{mock={ids:IDS,end:Date.now()+1800000,done:0};render()};b2.onclick=()=>{mock={ids:IDS,end:0,done:0};render()};const rw=$("div","row");rw.append(b1,b2);c.append(rw);a.append(c);return}
const hd=$("div","card","<b id='tm'></b>");a.append(hd);const tick=()=>{if(mock&&mock.end&&!mock.done){const r=Math.max(0,mock.end-Date.now());document.getElementById("tm").textContent="Time left: "+Math.floor(r/60000)+":"+String(Math.floor(r/1000)%60).padStart(2,"0");if(!r){mock.done=1;render()}}else if(document.getElementById("tm"))document.getElementById("tm").textContent=mock.done?"Review mode":"Untimed"};tick();timer=setInterval(tick,1000);
let score=0;mock.ids.forEach((id,i)=>{const q=Q.find(x=>x.id==id),c=$("div","card",`<b>${i+1}. ${esc(q.q)}</b>${q.c?'<pre class="code">'+esc(q.c)+"</pre>":""} <span class="tag">${q.mk} marks</span>`);if(!mock.done)c.append($("textarea"));else{c.append($("div","box",`<b>Answer:</b> ${esc(q.ex)}\n${q.s.map(esc).join("\n")}`));const r=$("div","row"),g=$("button","","✔ I got it"),w=$("button","","❌ Missed");g.onclick=()=>{mock["r"+id]=1;st(id).ok++;st(id).att++;st(id).need=0;save();render()};w.onclick=()=>{mock["r"+id]=0;st(id).need=(st(id).need||0)+1;st(id).att++;save();render()};r.append(g,w);c.append(r);if(mock["r"+id]!=null)c.append($("div","note",mock["r"+id]?"Marked correct":"Marked for practice"));score+=mock["r"+id]?1:0}a.append(c)});
if(!mock.done){const f=$("button","p","Finish & show answers");f.onclick=()=>{mock.done=1;render()};a.append(f)}else{const rated=mock.ids.filter(i=>mock["r"+i]!=null).length;a.append($("div","card",`Self-rated: ${rated}/${mock.ids.length}. Score ${score}/${mock.ids.length}`));const sv=$("button","p","Save score & exit");sv.onclick=()=>{S._mock=(S._mock||[]).concat([{s:score,n:mock.ids.length}]);save();mock=null;render()};a.append(sv)}}
render();
</script></body></html>
