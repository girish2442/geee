<script>
const Q=[
// M1
{id:1,m:1,tp:"Rank",d:"Level 1",imp:"⭐ Must Know",ty:"Theory",mk:2,q:"Define the rank of a matrix. What is row echelon form (REF)?",h:"Think: number of non-zero rows after reduction.",s:["Rank = the maximum number of linearly independent rows (equivalently columns); equivalently the number of non-zero rows in an echelon form.","REF: (i) all zero rows are at the bottom; (ii) the first non-zero entry (leading entry) of each row lies to the right of the leading entry of the row above; (iii) entries below each leading entry are 0."],a:"Rank = number of non-zero rows in REF. Row operations do not change rank.",mi:"Counting rows of the original matrix instead of the REF.",sim:"State when a system AX=B is consistent in terms of rank.",sa:"Consistent ⇔ rank A = rank [A|B]."},
{id:2,m:1,tp:"Rank",d:"Level 2",imp:"🔥 High Priority",ty:"Numerical",mk:4,q:"Find the rank of A = [[1,2,3],[2,4,6],[1,1,1]].",h:"Use R2→R2−2R1 and R3→R3−R1.",s:["R2→R2−2R1 gives [0,0,0].","R3→R3−R1 gives [0,−1,−2].","Matrix now: [1,2,3],[0,0,0],[0,−1,−2]. Swap R2,R3 → [1,2,3],[0,−1,−2],[0,0,0].","Two non-zero rows."],a:"Rank = 2",mi:"Forgetting that a zero row means rank drops; sign slips in R3−R1.",sim:"Find rank of [[1,2,3],[2,4,7],[3,6,10]].",sa:"R2−2R1=[0,0,1], R3−3R1=[0,0,1], then R3−R2=0. Rank = 2."},
{id:3,m:1,tp:"Gauss elimination",d:"Level 2",imp:"🔥 High Priority",ty:"Long",mk:6,q:"Solve by Gauss elimination:\nx + y + z = 6\n2x − y + z = 3\nx + 2y − z = 2",h:"Eliminate x from equations 2 and 3 first.",s:["Augmented matrix [1,1,1 | 6; 2,−1,1 | 3; 1,2,−1 | 2].","R2→R2−2R1: [0,−3,−1 | −9]. R3→R3−R1: [0,1,−2 | −4].","R3→R3+(1/3)R2: [0,0,−7/3 | −7].","Back substitution: −(7/3)z=−7 ⇒ z=3.","−3y−z=−9 ⇒ −3y=−6 ⇒ y=2.","x+y+z=6 ⇒ x=1.","Check eq 2: 2−2+3=3 ✓; eq 3: 1+4−3=2 ✓."],a:"x=1, y=2, z=3 (unique solution)",mi:"Arithmetic slips in R3+(1/3)R2; not verifying in the original equations.",sim:"Solve x+y+z=3, x−y+z=1, x+y−z=1.",sa:"(1,1,1)"},
{id:4,m:1,tp:"Consistency",d:"Level 3",imp:"🔥 High Priority",ty:"Mixed",mk:6,q:"For what k is the system consistent? Solve it then.\nx + y + z = 1\nx + 2y + 3z = 2\n2x + 3y + 4z = k",h:"Reduce [A|B]; look at the last row.",s:["R2−R1: [0,1,2 | 1]. R3−2R1: [0,1,2 | k−2].","R3−R2: [0,0,0 | k−3].","Consistent ⇔ rank A = rank [A|B]: need k−3=0.","For k=3: rank = 2 < 3 unknowns ⇒ infinitely many solutions. Put z=t.","y+2z=1 ⇒ y=1−2t. x=1−y−z=1−(1−2t)−t=t."],a:"k=3. Solutions (x,y,z)=(t, 1−2t, t), t∈ℝ. For k≠3: no solution.",mi:"Saying 'unique solution' when rank < number of unknowns.",sim:"x+y+z=2, x+2y+3z=4, 2x+3y+4z=k. Find k for consistency.",sa:"R3−2R1−(R2−R1) gives [0,0,0|k−6]; k=6."},
{id:5,m:1,tp:"Eigenvalues",d:"Level 2",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"Find eigenvalues and eigenvectors of A = [[2,1],[1,2]].",h:"Solve det(A−λI)=0.",s:["det(A−λI)=(2−λ)²−1=λ²−4λ+3=(λ−1)(λ−3)=0 ⇒ λ=1,3.","λ=3: (A−3I)v=0: −x+y=0 ⇒ v=(1,1).","λ=1: (A−I)v=0: x+y=0 ⇒ v=(1,−1)."],a:"λ=1 with (1,−1); λ=3 with (1,1) (any non-zero multiple).",mi:"Writing (2−λ)²+1 instead of −1; getting the zero vector as an eigenvector.",sim:"Eigenvalues/vectors of [[3,1],[1,3]].",sa:"λ=2: (1,−1); λ=4: (1,1)."},
{id:6,m:1,tp:"Diagonalization",d:"Level 3",imp:"🔥 High Priority",ty:"Long",mk:6,q:"Diagonalize A = [[4,1],[2,3]]: find P and D with P⁻¹AP = D.",h:"Trace=7, det=10 gives the characteristic equation quickly.",s:["λ²−7λ+10=0 ⇒ λ=5, 2.","λ=5: A−5I=[−1,1;2,−2] ⇒ −x+y=0 ⇒ v₁=(1,1).","λ=2: A−2I=[2,1;2,1] ⇒ 2x+y=0 ⇒ v₂=(1,−2).","P=[v₁ v₂]=[1,1;1,−2], D=diag(5,2) (same order as columns).","Check: A(1,−2)=(2,−4)=2(1,−2) ✓."],a:"P=[[1,1],[1,−2]], D=diag(5,2)",mi:"Order of eigenvalues in D not matching the columns of P.",sim:"Diagonalize [[3,1],[0,2]].",sa:"λ=3,2; P=[[1,1],[0,−1]], D=diag(3,2)."},
{id:7,m:1,tp:"Eigenvalues",d:"Level 2",imp:"⭐ Must Know",ty:"Find the mistake",mk:3,q:"A student finds eigenvalues of [[1,2],[3,4]]: 'λ²−5λ+10=0'. Find the mistake and correct it.",h:"What is det A?",s:["Trace = 1+4 = 5 ✓.","det = 1·4 − 2·3 = −2, not 10 (student added 4+6).","Correct: λ²−5λ−2=0 ⇒ λ=(5±√33)/2."],a:"Error: det computed wrongly. Correct eigenvalues (5±√33)/2.",mi:"Adding the products in the determinant instead of subtracting.",sim:"Eigenvalues of [[2,1],[4,3]].",sa:"λ²−5λ+2=0 ⇒ (5±√17)/2."},
{id:8,m:1,tp:"Diagonalization",d:"Level 4",imp:"🔥 High Priority",ty:"Conceptual",mk:4,q:"Is A = [[2,1],[0,2]] diagonalizable? Justify.",h:"Count independent eigenvectors for λ=2.",s:["Triangular ⇒ eigenvalues 2, 2 (repeated).","(A−2I)v=0: [0,1;0,0] ⇒ y=0 ⇒ only v=(1,0) up to scaling.","Only 1 independent eigenvector < 2 needed."],a:"Not diagonalizable (needs n independent eigenvectors).",mi:"Assuming repeated eigenvalue ⇒ diagonalizable (or ⇒ not) automatically.",sim:"Is [[3,1],[0,3]] diagonalizable?",sa:"No: only eigenvector (1,0)."},
// M2
{id:9,m:2,tp:"Homogeneous ODE",d:"Level 2",imp:"🔥 High Priority",ty:"Numerical",mk:3,q:"Solve y″ − 5y′ + 6y = 0.",h:"Auxiliary equation m²−5m+6=0.",s:["(m−2)(m−3)=0 ⇒ m=2,3 (real, distinct).","y = C₁e^{2x} + C₂e^{3x}."],a:"y = C₁e^{2x} + C₂e^{3x}",mi:"Writing roots with wrong sign (e^{−2x}).",sim:"Solve y″−3y′+2y=0.",sa:"y=C₁eˣ+C₂e^{2x}"},
{id:10,m:2,tp:"Homogeneous ODE",d:"Level 2",imp:"🔥 High Priority",ty:"Numerical",mk:3,q:"Solve y″ + 4y′ + 4y = 0.",h:"Repeated root case.",s:["m²+4m+4=(m+2)²=0 ⇒ m=−2,−2.","Repeated roots: y=(C₁+C₂x)e^{mx}."],a:"y=(C₁+C₂x)e^{−2x}",mi:"Writing C₁e^{−2x}+C₂e^{−2x} (not independent).",sim:"Solve y″−6y′+9y=0.",sa:"y=(C₁+C₂x)e^{3x}"},
{id:11,m:2,tp:"Homogeneous ODE",d:"Level 2",imp:"🔥 High Priority",ty:"Numerical",mk:3,q:"Solve y″ + 2y′ + 5y = 0.",h:"Complex roots m=α±iβ.",s:["m=(−2±√(4−20))/2=−1±2i.","y=e^{αx}(C₁cosβx+C₂sinβx) with α=−1, β=2."],a:"y=e^{−x}(C₁cos2x+C₂sin2x)",mi:"Using β=4 (√−16) instead of 2 after dividing by 2.",sim:"Solve y″+2y′+2y=0.",sa:"y=e^{−x}(C₁cos x+C₂sin x)"},
{id:12,m:2,tp:"Initial value problem",d:"Level 2",imp:"⭐ Must Know",ty:"Short",mk:4,q:"Solve y″ + y = 0, y(0)=1, y′(0)=2.",h:"General solution first, then use both conditions.",s:["m²+1=0 ⇒ m=±i ⇒ y=C₁cos x+C₂sin x.","y(0)=C₁=1.","y′=−C₁sin x+C₂cos x ⇒ y′(0)=C₂=2."],a:"y=cos x + 2 sin x",mi:"Using y′(0) on y instead of y′.",sim:"Solve y″+4y=0, y(0)=0, y′(0)=2.",sa:"y=sin 2x"},
{id:13,m:2,tp:"Particular integral",d:"Level 3",imp:"🔥 High Priority",ty:"Long",mk:5,q:"Solve y″ − 3y′ + 2y = e^{3x}.",h:"PI for e^{ax}: replace D by a if f(a)≠0.",s:["CF: m²−3m+2=0 ⇒ m=1,2 ⇒ C₁eˣ+C₂e^{2x}.","PI = e^{3x}/(3²−3·3+2)= e^{3x}/2.","y=CF+PI."],a:"y=C₁eˣ+C₂e^{2x}+e^{3x}/2",mi:"Forgetting to add the CF.",sim:"Solve y″−3y′+2y=e^{4x} (PI only).",sa:"PI=e^{4x}/6"},
{id:14,m:2,tp:"Particular integral",d:"Level 4",imp:"🔥 High Priority",ty:"Short",mk:4,q:"Find a particular integral of y″ + 4y = sin 2x.",h:"f(D)=D²+4 vanishes at D²=−4: resonance case.",s:["Putting D²=−4 makes D²+4 = 0, so this is the resonance case: multiply by x.","Standard result: PI of (D²+a²)y = sin ax is −x cos(ax)/(2a).","a=2 ⇒ PI = −(x/4)cos2x.","Check: y′=−¼cos2x+(x/2)sin2x; y″=sin2x+x cos2x; so y″+4y = sin2x ✓."],a:"PI = −(x cos 2x)/4",mi:"Writing −sin2x/(4−4) (division by zero).",sim:"PI of y″+9y=cos3x.",sa:"PI = x sin3x/6"},
{id:15,m:2,tp:"Variation of parameters",d:"Level 4",imp:"🔥 High Priority",ty:"Long",mk:8,q:"Solve y″ + y = sec x by variation of parameters.",h:"y₁=cos x, y₂=sin x; W=?",s:["CF: y=C₁cos x+C₂sin x.","W=y₁y₂′−y₂y₁′=cos²x+sin²x=1.","PI = −y₁∫(y₂R/W)dx + y₂∫(y₁R/W)dx, R=sec x.","∫ sin x sec x dx = ∫tan x dx = −ln|cos x|.","∫ cos x sec x dx = ∫1 dx = x.","PI = −cos x(−ln|cos x|) + x sin x = cos x ln|cos x| + x sin x."],a:"y=C₁cos x+C₂sin x+cos x·ln|cos x|+x sin x",mi:"Wrong sign in the first term; forgetting W.",sim:"PI of y″+y=tan x.",sa:"PI = −cos x · ln|sec x+tan x|"},
{id:16,m:2,tp:"Undetermined coefficients",d:"Level 3",imp:"⭐ Must Know",ty:"Long",mk:6,q:"Solve y″ + 3y′ + 2y = x by undetermined coefficients.",h:"Try yₚ = Ax + B.",s:["CF: m²+3m+2=0 ⇒ m=−1,−2 ⇒ C₁e^{−x}+C₂e^{−2x}.","yₚ=Ax+B ⇒ y′=A, y″=0.","3A+2(Ax+B)=x ⇒ 2A=1, 3A+2B=0.","A=1/2, B=−3/4."],a:"y=C₁e^{−x}+C₂e^{−2x}+x/2−3/4",mi:"Dropping the constant B from the trial.",sim:"PI of y″+2y′+y=x.",sa:"PI=x−2"},
{id:17,m:1,tp:"Linear systems",d:"Level 1",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"What is a linear system? Define the augmented matrix, the allowed row operations and row echelon form.",h:"Think of AX = B and the column of right-hand sides.",s:["SIMPLE: In a linear system every unknown appears only to power 1 (no products like xy). Example: x + y = 3, 2x − y = 0.","Matrix form AX = B. The augmented matrix [A|B] is A with the RHS column B added.","Allowed row operations: (i) swap two rows; (ii) multiply a row by a non-zero number; (iii) add a multiple of one row to another. They do not change the solutions or the rank.","Row echelon form: zero rows at the bottom; each leading entry is to the right of the leading entry above; zeros below each leading entry."],a:"Row operations never change the solution set or the rank.",mi:"Doing an operation on A but forgetting the RHS column.",sim:"Write the augmented matrix of x + 2y = 5, 3x − y = 1.",sa:"[1 2 | 5; 3 −1 | 1]"},
{id:18,m:1,tp:"Gauss elimination",d:"Level 1",imp:"⭐ Must Know",ty:"Numerical",mk:3,q:"Solve by Gauss elimination: 2x + y = 5, x − y = 1.",h:"Make the top-left entry 1 by swapping rows.",s:["Augmented matrix [2 1 | 5; 1 −1 | 1].","R1 ↔ R2: [1 −1 | 1; 2 1 | 5].","R2 → R2 − 2R1: [1 −1 | 1; 0 3 | 3].","3y = 3 ⇒ y = 1. Back-substitute: x − 1 = 1 ⇒ x = 2.","Check: 2(2)+1 = 5 ✓."],a:"x = 2, y = 1 (unique solution)",mi:"Subtracting from the left side only.",sim:"Solve x + 2y = 5, 3x + y = 5.",sa:"R2−3R1: [0 −5 | −10] ⇒ y=2, x=1."},
{id:19,m:1,tp:"Consistency",d:"Level 2",imp:"🔥 High Priority",ty:"Conceptual",mk:4,q:"Without solving fully, decide the nature of each system: (a) x+y=2, 2x+2y=5 (b) x+y=2, 2x+2y=4 (c) x+y=2, x−y=0.",h:"Reduce [A|B] and compare rank A with rank [A|B].",s:["Rule: rank A ≠ rank[A|B] ⇒ NO solution. rank A = rank[A|B] = n (unknowns) ⇒ UNIQUE. rank A = rank[A|B] < n ⇒ INFINITELY MANY.","(a) R2−2R1: [0 0 | 1] means 0 = 1. rank A = 1, rank[A|B] = 2 ⇒ no solution.","(b) R2−2R1: [0 0 | 0]. rank A = rank[A|B] = 1 < 2 ⇒ infinitely many (y = t, x = 2 − t).","(c) R2−R1: [0 −2 | −2] ⇒ y = 1, x = 1. Ranks both 2 = n ⇒ unique."],a:"(a) none  (b) infinitely many  (c) unique (x=y=1)",mi:"Confusing 'consistent' (has a solution) with 'unique' (only one).",sim:"Nature of x − y = 1, 2x − 2y = 3?",sa:"R2−2R1: [0 0 | 1] ⇒ no solution."},
{id:20,m:1,tp:"Linear independence",d:"Level 2",imp:"📌 Important",ty:"Numerical",mk:4,q:"Are the vectors (1,0,1), (0,1,1), (1,1,2) linearly independent?",h:"Put them as rows and find the rank.",s:["Matrix rows: [1 0 1; 0 1 1; 1 1 2].","R3 → R3 − R1: [0 1 1].","R3 → R3 − R2: [0 0 0].","Rank = 2 < 3 vectors ⇒ dependent. Indeed (1,1,2) = (1,0,1) + (0,1,1)."],a:"Linearly dependent (rank 2 < 3)",mi:"Concluding independence just because no vector is a visible multiple of another.",sim:"Are (1,0,0), (1,1,0), (1,1,1) independent?",sa:"Already echelon, rank 3 ⇒ independent."},
{id:21,m:1,tp:"Consistency",d:"Level 3",imp:"🔥 High Priority",ty:"Long",mk:6,q:"For what k does x+y+z=0, x+2y+3z=0, 2x+3y+kz=0 have non-trivial solutions? Find them.",h:"A homogeneous system always has x=y=z=0. Non-trivial needs rank < 3.",s:["Matrix [1 1 1; 1 2 3; 2 3 k].","R2−R1: [0 1 2]. R3−2R1: [0 1 k−2].","R3−R2: [0 0 k−4].","Non-trivial solutions need rank < 3 ⇒ k − 4 = 0 ⇒ k = 4.","Then z = t, y + 2z = 0 ⇒ y = −2t, x = −y − z = t. Check eq 3: 2t − 6t + 4t = 0 ✓."],a:"k = 4; solutions (x,y,z) = t(1, −2, 1). For k ≠ 4 only the trivial solution.",mi:"Forgetting that a homogeneous system is always consistent.",sim:"x+y+z=0, x+3y+5z=0, 2x+4y+kz=0. Find k.",sa:"R2−R1: [0 2 4]; R3−2R1: [0 2 k−2]; R3−R2: [0 0 k−6]; k = 6."},
{id:22,m:1,tp:"Consistency",d:"Level 1",imp:"⭐ Must Know",ty:"Method",mk:2,q:"Which condition decides whether AX = B is consistent?\nA. det A = 0 only\nB. rank A = rank [A|B]\nC. trace of A\nD. eigenvalues of A",h:"Think of the last row 0 = 1.",s:["Correct: B.","Consistent exactly when adding the column B does not increase the rank.","A: det applies only to square A and does not see B. C and D are unrelated to solvability."],a:"B — rank A = rank [A|B]",mi:"Using det A alone for a non-square or non-homogeneous system.",sim:"If rank A = 2, rank[A|B] = 3, what happens?",sa:"No solution."},
{id:23,m:1,tp:"Eigenvalues",d:"Level 2",imp:"⭐ Must Know",ty:"Numerical",mk:4,q:"For A = [[4,1],[2,3]], check whether v = (1,−2) and u = (1,2) are eigenvectors.",h:"Compute Av and compare with a multiple of v.",s:["Av = (4·1 + 1·(−2), 2·1 + 3·(−2)) = (2, −4) = 2(1, −2) = 2v ⇒ eigenvector, λ = 2.","Au = (4+2, 2+6) = (6, 8). Is it k·(1,2)? 6 ≠ 4, so no.","u is not an eigenvector."],a:"v is an eigenvector (λ = 2); u is not.",mi:"Checking only one component.",sim:"Is (1,1) an eigenvector of the same A?",sa:"A(1,1) = (5,5) = 5(1,1) ⇒ yes, λ = 5."},
{id:24,m:1,tp:"Eigenvalues",d:"Level 2",imp:"⭐ Must Know",ty:"Numerical",mk:4,q:"Find the eigenvalues of A = [[5,2],[3,4]] using trace and determinant. State the properties used.",h:"For 2×2: λ² − (trace)λ + det = 0.",s:["Properties: sum of eigenvalues = trace; product = determinant.","trace = 5+4 = 9; det = 5·4 − 2·3 = 14.","λ² − 9λ + 14 = 0 ⇒ (λ−2)(λ−7) = 0.","Check: 2+7 = 9 ✓; 2×7 = 14 ✓."],a:"λ = 2, 7",mi:"Writing det = 20 + 6.",sim:"Eigenvalues of [[1,2],[2,4]].",sa:"trace 5, det 0 ⇒ λ = 0, 5."},
{id:25,m:1,tp:"Eigenvalues",d:"Level 3",imp:"🔥 High Priority",ty:"Long",mk:6,q:"Find eigenvalues and eigenvectors of A = [[1,0,0],[0,3,1],[0,1,3]].",h:"The first row/column separates: one eigenvalue is read off, the rest from a 2×2 block.",s:["det(A−λI) = (1−λ)[(3−λ)² − 1] = 0.","(3−λ)² = 1 ⇒ λ = 2 or 4. So λ = 1, 2, 4.","λ=1: A−I has rows (0,0,0),(0,2,1),(0,1,2) ⇒ 2y+z=0 and y+2z=0 ⇒ y=z=0 ⇒ v=(1,0,0).","λ=2: y+z=0, x=0 ⇒ v=(0,1,−1). Check A v = (0,2,−2) = 2v ✓.","λ=4: −y+z=0, x=0 ⇒ v=(0,1,1). Check A v = (0,4,4) = 4v ✓."],a:"λ=1:(1,0,0); λ=2:(0,1,−1); λ=4:(0,1,1)",mi:"Stopping after finding only one eigenvector.",sim:"Eigenvalues of [[2,0,0],[0,4,1],[0,1,4]].",sa:"λ = 2, 3, 5 with vectors (1,0,0), (0,1,−1), (0,1,1)."},
{id:26,m:1,tp:"Eigenvalues",d:"Level 4",imp:"📌 Important",ty:"Numerical",mk:5,q:"For A = [[3,1],[k,3]], find k if 5 is an eigenvalue.",h:"If λ=5 is an eigenvalue then det(A − 5I) = 0.",s:["A − 5I = [[−2,1],[k,−2]].","det = (−2)(−2) − k = 4 − k = 0 ⇒ k = 4.","Check: A = [[3,1],[4,3]]: trace 6, det 5 ⇒ λ² − 6λ + 5 = 0 ⇒ λ = 1, 5 ✓."],a:"k = 4",mi:"Substituting λ into A instead of A − λI.",sim:"For [[2,k],[1,2]] find k if 3 is an eigenvalue.",sa:"det(A−3I) = (−1)(−1) − k = 1 − k = 0 ⇒ k = 1."},
{id:27,m:1,tp:"Diagonalization",d:"Level 1",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"What is diagonalization? State the condition for a matrix to be diagonalizable.",h:"Count eigenvectors.",s:["SIMPLE: Diagonalizing A means writing P⁻¹AP = D, where D is diagonal. It makes powers of A easy.","KEY IDEA: an n×n matrix is diagonalizable when it has n linearly independent eigenvectors.","Columns of P = eigenvectors; diagonal of D = the matching eigenvalues, in the same order.","If all n eigenvalues are distinct, A is diagonalizable. If an eigenvalue repeats, check how many independent eigenvectors it has."],a:"Diagonalizable ⇔ n independent eigenvectors.",mi:"Assuming a repeated eigenvalue always means 'not diagonalizable' (e.g. 2I is diagonal).",sim:"Is [[2,0],[0,2]] diagonalizable?",sa:"Yes. It is already diagonal; every vector is an eigenvector."},
{id:28,m:1,tp:"Diagonalization",d:"Level 3",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"Verify that P⁻¹AP = D for A = [[4,1],[2,3]], P = [[1,1],[1,−2]], D = diag(5,2).",h:"Easier check: show AP = PD.",s:["AP = [[4+1, 4−2],[2+3, 2−6]] = [[5,2],[5,−4]].","PD = [[1·5, 1·2],[1·5, −2·2]] = [[5,2],[5,−4]]. So AP = PD ✓.","det P = −2 − 1 = −3, P⁻¹ = (1/−3)[[−2,−1],[−1,1]] = [[2/3,1/3],[1/3,−1/3]].","P⁻¹(AP) = [[10/3+5/3, 4/3−4/3],[5/3−5/3, 2/3+4/3]] = [[5,0],[0,2]] = D ✓."],a:"P⁻¹AP = diag(5, 2) verified.",mi:"Wrong order of eigenvalues in D.",sim:"If P = [[1,1],[0,−1]] and D = diag(3,2) for A=[[3,1],[0,2]], check AP = PD.",sa:"AP = [[3,2],[0,−2]] = PD ✓."},
{id:29,m:2,tp:"Superposition",d:"Level 1",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"State the superposition principle for a homogeneous linear second-order ODE. Check it for y″ − y = 0.",h:"If y1 and y2 both work, what about C1y1 + C2y2?",s:["SIMPLE: For y″ + p y′ + q y = 0, if y1 and y2 are solutions, so is C1y1 + C2y2.","The general solution needs y1, y2 independent (not constant multiples).","Example: y1 = eˣ, y2 = e⁻ˣ. For y = C1eˣ + C2e⁻ˣ, y″ = C1eˣ + C2e⁻ˣ = y ✓."],a:"y = C1y1 + C2y2 is also a solution (and general if y1,y2 are independent).",mi:"Applying superposition to non-homogeneous equations.",sim:"Is y = e^{2x} + 3e^{3x} a solution of y″−5y′+6y=0?",sa:"Yes: 4−10+6 = 0 and 9−15+6 = 0, so each term solves it."},
{id:30,m:2,tp:"Method choice",d:"Level 2",imp:"🔥 High Priority",ty:"Method",mk:3,q:"Solve y″ − 3y′ + 2y = e^{4x}. Which method should you use?\nA. Variation of parameters\nB. Undetermined coefficients\nC. Separation of variables\nD. Gauss elimination",h:"What kind of function is the RHS?",s:["Correct: B — undetermined coefficients (or the D-operator).","Why: constant coefficients and RHS = e^{4x}, a standard form.","CF: m²−3m+2 = 0 ⇒ m = 1, 2 ⇒ C1eˣ + C2e^{2x}.","PI = e^{4x}/(16−12+2) = e^{4x}/6.","y = C1eˣ + C2e^{2x} + e^{4x}/6."],a:"B. y = C1eˣ + C2e^{2x} + e^{4x}/6",mi:"Using variation of parameters (correct but long) or forgetting the CF.",sim:"Which method for y″+y=sec x?",sa:"Variation of parameters; sec x is not a standard form."},
{id:31,m:2,tp:"Method choice",d:"Level 2",imp:"🔥 High Priority",ty:"Method",mk:2,q:"For y″ + y = sec x, which method works?\nA. Variation of parameters\nB. Undetermined coefficients\nC. Separation of variables\nD. Gauss elimination",h:"Is sec x a polynomial, exponential, sine or cosine?",s:["Correct: A.","B fails: sec x is not polynomial, exponential, sine or cosine, so no trial function exists.","C is for first-order separable equations; D is for linear systems."],a:"A — variation of parameters",mi:"Forcing a trial like A sec x.",sim:"Method for y″−y=x²?",sa:"Undetermined coefficients (polynomial RHS)."},
{id:32,m:2,tp:"Homogeneous ODE",d:"Level 2",imp:"⭐ Must Know",ty:"Method",mk:5,q:"Identify the root case, then solve: (a) y″ − 4y = 0 (b) y″ + 6y′ + 9y = 0 (c) y″ + 4y = 0.",h:"Find the auxiliary equation, then decide: real distinct, repeated or complex.",s:["(a) m² − 4 = 0 ⇒ m = ±2 (real distinct) ⇒ y = C1e^{2x} + C2e^{−2x}.","(b) m² + 6m + 9 = (m+3)² = 0 ⇒ m = −3, −3 (repeated) ⇒ y = (C1 + C2x)e^{−3x}.","(c) m² + 4 = 0 ⇒ m = ±2i (α = 0, β = 2) ⇒ y = C1 cos2x + C2 sin2x."],a:"(a) C1e^{2x}+C2e^{−2x}  (b) (C1+C2x)e^{−3x}  (c) C1cos2x+C2sin2x",mi:"Using e^{3x} instead of e^{−3x} in (b).",sim:"Identify the case: y″ + 2y′ + 10y = 0.",sa:"m = −1 ± 3i (complex) ⇒ y = e^{−x}(C1 cos3x + C2 sin3x)."},
{id:33,m:2,tp:"Initial value problem",d:"Level 2",imp:"⭐ Must Know",ty:"Numerical",mk:5,q:"Solve y″ − 3y′ + 2y = 0 with y(0) = 2, y′(0) = 3.",h:"General solution first; use y(0) in y and y′(0) in y′.",s:["m = 1, 2 ⇒ y = C1eˣ + C2e^{2x}.","y(0) = C1 + C2 = 2.","y′ = C1eˣ + 2C2e^{2x} ⇒ y′(0) = C1 + 2C2 = 3.","Subtract: C2 = 1, then C1 = 1.","Check: y′(0) = 1 + 2 = 3 ✓."],a:"y = eˣ + e^{2x}",mi:"Using y′(0) in y (do not confuse y(0) with y′(0)).",sim:"Solve y″−y=0, y(0)=1, y′(0)=0.",sa:"y = C1eˣ+C2e⁻ˣ; C1+C2=1, C1−C2=0 ⇒ y = (eˣ+e⁻ˣ)/2."},
{id:34,m:2,tp:"Initial value problem",d:"Level 3",imp:"🔥 High Priority",ty:"Long",mk:6,q:"Solve y″ − 3y′ + 2y = e^{3x}, y(0) = 1, y′(0) = 0.",h:"General solution = CF + PI first, then apply BOTH conditions to the full solution.",s:["From Q13: y = C1eˣ + C2e^{2x} + e^{3x}/2.","y(0) = C1 + C2 + 1/2 = 1 ⇒ C1 + C2 = 1/2.","y′ = C1eˣ + 2C2e^{2x} + (3/2)e^{3x} ⇒ y′(0) = C1 + 2C2 + 3/2 = 0 ⇒ C1 + 2C2 = −3/2.","Subtract: C2 = −2, C1 = 5/2.","Check: y(0) = 2.5 − 2 + 0.5 = 1 ✓; y′(0) = 2.5 − 4 + 1.5 = 0 ✓."],a:"y = (5/2)eˣ − 2e^{2x} + (1/2)e^{3x}",mi:"Applying conditions to the CF alone.",sim:"Solve y″−y′−2y=0, y(0)=3, y′(0)=0.",sa:"m=2,−1: C1+C2=3, 2C1−C2=0 ⇒ y = e^{2x}+2e^{−x}."},
{id:35,m:2,tp:"Particular integral",d:"Level 3",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"Find a particular integral of y″ + 4y = x².",h:"Try yp = Ax² + Bx + C (a full polynomial of the same degree).",s:["Method: RHS polynomial, constant coefficients ⇒ undetermined coefficients.","yp = Ax² + Bx + C, yp″ = 2A.","2A + 4Ax² + 4Bx + 4C = x².","x²: 4A = 1 ⇒ A = 1/4. x: 4B = 0 ⇒ B = 0. Constant: 2A + 4C = 0 ⇒ C = −1/8.","Check: yp″ + 4yp = 1/2 + x² − 1/2 = x² ✓."],a:"yp = x²/4 − 1/8",mi:"Taking yp = Ax² only (missing Bx and C).",sim:"PI of y″ + 9y = x.",sa:"yp = x/9."},
{id:36,m:2,tp:"Particular integral",d:"Level 3",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"Find a PI of y″ − 3y′ + 2y = sin x.",h:"Always include BOTH cos x and sin x in the trial.",s:["Trial yp = A cos x + B sin x. yp′ = −A sin x + B cos x, yp″ = −A cos x − B sin x.","Substitute: (−A cos − B sin) − 3(−A sin + B cos) + 2(A cos + B sin).","cos x terms: A − 3B. sin x terms: 3A + B.","Match RHS (0·cos x + 1·sin x): A − 3B = 0, 3A + B = 1.","A = 3B ⇒ 10B = 1 ⇒ B = 1/10, A = 3/10."],a:"yp = (3 cos x + sin x)/10",mi:"Trying only B sin x.",sim:"PI of y″ + 3y′ + 2y = cos x.",sa:"A+3B=1, B−3A=0 ⇒ yp = (cos x + 3 sin x)/10."},
{id:37,m:2,tp:"Resonance",d:"Level 4",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"Find a PI of y″ − 3y′ + 2y = eˣ. What goes wrong with the usual method?",h:"Check what e^{x} is in the CF.",s:["CF: m = 1, 2 ⇒ C1eˣ + C2e^{2x}. The RHS eˣ is already in the CF, so this is resonance.","Usual PI = eˣ/f(1) with f(m) = m² − 3m + 2 gives f(1) = 0 ⇒ division by zero.","Fix: multiply by x: PI = x eˣ / f′(1), f′(m) = 2m − 3 ⇒ f′(1) = −1.","PI = −x eˣ.","Check: yp = −xeˣ, yp′ = −(1+x)eˣ, yp″ = −(2+x)eˣ. yp″ − 3yp′ + 2yp = eˣ[−2−x+3+3x−2x] = eˣ ✓."],a:"yp = −x eˣ",mi:"Trying A eˣ again (it gives 0 = eˣ).",sim:"PI of y″ − 4y′ + 3y = eˣ.",sa:"f(1)=0, f′(1)=−2 ⇒ yp = −x eˣ/2."},
{id:38,m:2,tp:"Resonance",d:"Level 4",imp:"📌 Important",ty:"Conceptual",mk:4,q:"For y″ − 2y′ + y = eˣ, which trial for yp works: A eˣ, A x eˣ or A x² eˣ? Find A.",h:"Write the CF first: the root is repeated.",s:["CF: (m−1)² = 0 ⇒ (C1 + C2x)eˣ. Both eˣ and xeˣ are in the CF, so Aeˣ and Axeˣ give zero.","Use yp = A x² eˣ. yp′ = A(2x + x²)eˣ, yp″ = A(2 + 4x + x²)eˣ.","yp″ − 2yp′ + yp = Aeˣ[2+4x+x² − 4x − 2x² + x²] = 2Aeˣ.","2A = 1 ⇒ A = 1/2."],a:"Trial A x² eˣ; yp = x²eˣ/2",mi:"Stopping at x·eˣ.",sim:"PI of y″−4y′+4y=e^{2x}.",sa:"yp = x²e^{2x}/2."},
{id:39,m:2,tp:"Variation of parameters",d:"Level 2",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"When should variation of parameters be used? Write the formula.",h:"Think of RHS like sec x, tan x, 1/x.",s:["SIMPLE: Use it when the RHS is NOT a polynomial, exponential, sine or cosine (so undetermined coefficients fails), or when you want a method that always works.","With CF y = C1y1 + C2y2 and W = y1y2′ − y2y1′ (for y″ + py′ + qy = R):","yp = −y1∫(y2R/W)dx + y2∫(y1R/W)dx.","General solution = CF + yp. Equation must have y″ with coefficient 1."],a:"yp = −y1∫y2R/W dx + y2∫y1R/W dx, W = y1y2′ − y2y1′.",mi:"Wrong sign in the first term.",sim:"Which method for y″+y=x²?",sa:"Undetermined coefficients (polynomial RHS)."}
];
const METH={2:["Row reduction","Rank = number of non-zero rows in echelon form."],3:["Gauss elimination","3 unknowns: reduce [A|B] then back-substitute."],4:["Gauss elimination + rank comparison","A parameter k: look at the last row."],5:["det(A−λI)=0","Eigenvalues and eigenvectors asked."],6:["Eigenvalues → eigenvectors → P, D","Diagonalization needs n independent eigenvectors."],8:["Count independent eigenvectors","Repeated eigenvalue: compare with n."],9:["Auxiliary equation, real distinct roots","Constant coefficients, RHS = 0."],10:["Auxiliary equation, repeated root","Discriminant = 0."],11:["Auxiliary equation, complex roots","Discriminant < 0."],12:["CF, then use y(0), y′(0)","Initial value problem."],13:["Undetermined coefficients (exponential RHS)","RHS e^{ax}, f(a) ≠ 0."],14:["Resonance rule (multiply by x)","f(D) = 0 at the RHS frequency."],15:["Variation of parameters","sec x is not a standard form."],16:["Undetermined coefficients (polynomial)","RHS is a polynomial."],18:["Gauss elimination","2 unknowns."],19:["Compare rank A and rank [A|B]","Nature of solutions."],21:["Row reduce; need rank < n","Homogeneous with a parameter."],25:["det(A−λI)=0, block structure","3×3 with zeros."],28:["Check AP = PD","Easier than inverting P."],30:["Undetermined coefficients","RHS exponential, constant coefficients."],31:["Variation of parameters","RHS sec x."],32:["Auxiliary equation, identify the case","Three cases."],33:["CF then conditions","Homogeneous IVP."],34:["CF + PI, then conditions","Non-homogeneous IVP."],35:["Undetermined coefficients (polynomial)","RHS x²."],36:["Undetermined coefficients (sin)","Use cos and sin both."],37:["Resonance rule","f(1) = 0."],38:["Modified trial x²eˣ","Repeated root equals RHS exponent."],39:["Variation of parameters","RHS not standard."]};
const TOP=[2,3,4,19,5,24,6,28,9,10,11,12,13,36,37,15,31];
let pi=0;
const SHEET=`LINEAR ALGEBRA
Row ops: swap · scale by non-zero · add a multiple of one row to another (apply to the RHS too).
Rank = number of non-zero rows in echelon form.
Consistency: rank A ≠ rank[A|B] → none. rank A = rank[A|B] = n → unique. = r < n → infinite (n−r free variables).
Homogeneous AX=0: always consistent; non-trivial solutions ⇔ rank < n.
Eigenvalues: det(A−λI)=0. 2×2: λ² − (trace)λ + det = 0. Sum = trace, product = det.
Eigenvectors: solve (A−λI)v=0, v≠0. Verify Av=λv.
Diagonalization: n independent eigenvectors needed. P=[v1…vn], D=diag(λ1…λn) same order. Check AP=PD.
Repeated eigenvalue: diagonalizable only if enough independent eigenvectors (2I yes, [[2,1],[0,2]] no).
ODE y″+ay′+by=0: auxiliary m²+am+b=0.
 real distinct: C1e^{m1x}+C2e^{m2x}
 repeated: (C1+C2x)e^{mx}
 complex α±iβ: e^{αx}(C1cosβx+C2sinβx)
General solution = CF + PI.  IVP: apply y(0) to y and y′(0) to y′ of the FULL solution.
PI e^{ax}: e^{ax}/f(a) if f(a)≠0; if f(a)=0 use x e^{ax}/f′(a); if also f′(a)=0 use x²e^{ax}/f″(a).
PI polynomial: trial full polynomial of the same degree. PI sin/cos: trial A cos + B sin (both).
Trial overlaps the CF → multiply the trial by x (or x²).
Variation of parameters: W=y1y2′−y2y1′; yp=−y1∫y2R/W + y2∫y1R/W (y″ coefficient 1).
MISTAKES: RHS forgotten in row ops · only one eigenvector · P/D order · e^{3x} vs e^{−3x} · missing x multiplier · y(0) vs y′(0) · no CF in final answer.`;
let tab="1",S={};try{S=JSON.parse(localStorage.getItem("g101")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("g101",JSON.stringify(S))}catch(e){}};
const st=id=>S[id]||(S[id]={att:0,ok:0,need:0}),$=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function nav(){const n=document.getElementById("nav");n.innerHTML="";[["1","Module 1"],["2","Module 2"],["top","⭐ Top"],["prac","🧠 Practice"],["sheet","Quick Sheet"],["rev","Revision"],["prog","Progress"]].forEach(([k,l])=>{const b=$("button",tab==k?"on":"",l);b.onclick=()=>{tab=k;render()};n.append(b)})}
function flash(t){const e=$("div","note",t);document.getElementById("app").prepend(e);setTimeout(()=>e.remove(),1500)}
const RK=q=>q.imp.includes("Must")?0:q.imp.includes("High")?1:q.imp.includes("Important")?2:3;
const mastered=q=>st(q.id).ok>0&&!st(q.id).need;
function card(q){const c=$("div","card"),s=st(q.id);let step=0;
c.innerHTML=`<span class="tag">${q.tp}</span><span class="tag">${q.d}</span><span class="tag">${q.imp}</span><span class="tag">${q.ty}</span><span class="tag">${q.mk} marks (practice)</span><div class="q">Q${q.id}. ${esc(q.q)}</div>`;
const out=$("div"),row=$("div","row");c.append(row,out);
const add=(l,f,cls)=>{const b=$("button",cls||"",l);b.onclick=f;row.append(b)};
add("🤔 Think",()=>out.append($("div","box","Pause 30 seconds. What is given? What is asked? Which method fits? Try on paper before the hint.")));
add("💡 Hint",()=>out.append($("div","box",esc(q.h))));
if(METH[q.id])add("🧭 Which method?",()=>out.append($("div","box",`<b>Method:</b> ${esc(METH[q.id][0])}\n<b>Why:</b> ${esc(METH[q.id][1])}`)));
add("👣 Steps",()=>{if(step<q.s.length){out.append($("div","box",`<b>Step ${step+1}:</b> ${esc(q.s[step++])}`));s.att++;save()}});
add("✅ Answer",()=>out.append($("div","box",`<b>Final answer:</b> ${esc(q.a)}\n<b>⚠ Common mistake:</b> ${esc(q.mi)}`)),"p");
add("📝 Exam answer",()=>out.append($("div","box",`<b>Exam answer (write this):</b>\n${q.s.map(esc).join("\n")}\n<b>∴ ${esc(q.a)}</b>`)));
add("🔁 Similar",()=>{const w=$("div","box",`<b>Similar:</b> ${esc(q.sim)}\n`);const b=$("button","","Reveal answer");b.onclick=()=>{w.append($("div","",`<b>Answer:</b> ${esc(q.sa)}`));b.remove()};w.append(b);out.append(w)});
add("✔ I got it",()=>{s.ok++;s.att++;s.need=0;save();flash("Marked understood")});
add("❌ Need practice",()=>{s.need=(s.need||0)+1;s.att++;save();flash("Added to revision list");const t=weakTopic();if(t)flash("You need more practice with "+t+" — see the Practice tab.")});
return c}
function topicNeed(){const b={};Q.forEach(q=>{b[q.tp]=(b[q.tp]||0)+(st(q.id).need||0)});return b}
function weakTopic(){const b=topicNeed();return Object.keys(b).find(k=>b[k]>=2)}
function status(tp){const qs=Q.filter(q=>q.tp==tp);let a=0,o=0,n=0;qs.forEach(q=>{const s=st(q.id);a+=s.att;o+=s.ok;n+=s.need||0});if(!a)return"⚪ Not started";if(n)return"🔴 Weak";return o>=qs.length?"🟢 Strong":"🟡 Needs Practice"}
function next(){const tp=weakTopic();let c=[];if(tp)c=Q.filter(q=>q.tp==tp&&!st(q.id).ok);if(!c.length)c=Q.filter(q=>!mastered(q)).sort((x,y)=>(st(y.id).need?1:0)-(st(x.id).need?1:0)||RK(x)-RK(y)||x.d.localeCompare(y.d)||x.id-y.id);return{tp,q:c[0]}}
function render(){nav();const a=document.getElementById("app");a.innerHTML="";
if(tab=="1"||tab=="2"){a.append($("div","card note",tab=="1"?"Series 1 · Module 1 — Linear Algebra: Gauss elimination, rank, existence/uniqueness (no proofs needed), eigenvalues, eigenvectors, diagonalization.":"Series 1 · Module 2 — Second-order ODE: homogeneous, constant coefficients, CF, PI by undetermined coefficients, IVP, variation of parameters. Laplace/Fourier are NOT included unless faculty confirm."));Q.filter(q=>q.m==+tab).forEach(q=>a.append(card(q)))}
else if(tab=="top"){a.append($("div","card note","⭐ High-priority preparation questions — not a prediction of the paper."));TOP.forEach(i=>a.append(card(Q.find(q=>q.id==i))))}
else if(tab=="prac"){const n=next();const L=Q.filter(q=>!mastered(q)).sort((x,y)=>(st(y.id).need?1:0)-(st(x.id).need?1:0)||RK(x)-RK(y)||x.d.localeCompare(y.d)||x.id-y.id);if(!L.length){a.append($("div","card","All questions mastered 🎉"));return}if(n.tp)a.append($("div","card","<b>You need more practice with "+esc(n.tp)+".</b> Try this next question."));pi=pi%L.length;a.append($("div","card note",`Order: need-practice first, then Must Know → High → easy → exam. ${pi+1} of ${L.length} unmastered.`));a.append(card(n.tp&&pi==0?n.q:L[pi]));const b=$("button","p","Next question ▶");b.onclick=()=>{pi++;render()};a.append(b)}
else if(tab=="sheet")a.append($("div","card","<h3>📌 Quick Revision Sheet</h3><pre>"+esc(SHEET)+"</pre>"));
else if(tab=="rev"){const l=Q.filter(q=>st(q.id).need);l.length?l.forEach(q=>a.append(card(q))):a.append($("div","card","Nothing marked yet."))}
else{let t=0,o=0,nd=0;Q.forEach(q=>{t+=st(q.id).att;o+=st(q.id).ok;nd+=st(q.id).need?1:0});const c=f=>Q.filter(f).length;
let h=`<h3>Master Q&A summary</h3><p>Total ${Q.length} · Module 1: ${c(q=>q.m==1)} · Module 2: ${c(q=>q.m==2)} · ⭐ Must Know: ${c(q=>q.imp.includes("Must"))} · 🔥 High: ${c(q=>q.imp.includes("High"))}</p><p>Theory ${c(q=>q.ty=="Theory")} · Numerical ${c(q=>q.ty=="Numerical")} · Long/problem ${c(q=>q.ty=="Long"||q.ty=="Mixed")} · Exam-level (Level 3–4) ${c(q=>/3|4/.test(q.d))} · Method-selection ${c(q=>q.ty=="Method")}</p><h3>Progress</h3><p>Attempted ${t} · Understood ${o} · Need practice ${nd} · Accuracy ${t?Math.round(100*o/t):0}% · ⭐ Must Know remaining ${c(q=>q.imp.includes("Must")&&!mastered(q))}</p>`;
[1,2].forEach(m=>{const mq=Q.filter(q=>q.m==m);h+=`<div>Module ${m}: ${mq.filter(mastered).length}/${mq.length} mastered</div>`});h+="<br>";
const tps=[...new Set(Q.map(q=>q.tp))];h+=`<b>Strong:</b> ${tps.filter(x=>status(x).startsWith("🟢")).join(", ")||"—"}<br><b>Weak:</b> ${tps.filter(x=>status(x).startsWith("🔴")).join(", ")||"—"}<br><br>`;tps.forEach(x=>h+=`<div>${status(x)} — ${x}</div>`);
const nx=next();if(nx.q)h+=`<p><b>Recommended next:</b> Q${nx.q.id} (${esc(nx.q.tp)}) — open it in the Practice tab.</p>`;
const cd=$("div","card",h),b=$("button","","Reset progress");b.onclick=()=>{S={};save();render()};cd.append(b);a.append(cd)}}
render();
</script></body></html>
