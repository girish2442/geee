<script>
// ---------- Diagrams (inline SVG, offline) ----------
const W=(x0,y0,A,L,mode)=>{let p="";for(let x=0;x<=L;x+=2){let v=Math.sin(x/L*4*Math.PI);v=mode==1?Math.max(0,v):mode==2?Math.abs(v):v;p+=(x?"L":"M")+(x0+x).toFixed(0)+" "+(y0-A*v).toFixed(1)}return p};
const svg=(b,h)=>`<svg viewBox="0 0 400 ${h||170}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const VI=z=>svg(`<path class="a" d="M15 100H315M150 10V165"/><text x="300" y="115">V</text><text x="155" y="20">I</text><path class="cv" d="M150 100L205 99Q228 95 236 55L240 12"/><path class="cv" d="M150 100L${z?75:60} 101L${z?68:52} 106L${z?64:48} 150"/><text x="195" y="116">knee ≈0.7 V (Si)</text><text x="${z?30:20}" y="92">${z?"−Vz (breakdown)":"−VBR (breakdown)"}</text><text x="160" y="140">reverse leakage I0 (tiny)</text><text x="228" y="40">forward: current rises steeply</text>${z?'<path class="sh" d="M58 108H80V140H58Z"/><text x="90" y="135">Iz range: Vz nearly constant</text>':""}`);
const DG={
bands:["Energy bands: conductor, semiconductor, insulator","Observe: conductor bands overlap (no gap); semiconductor has a small gap Eg (Si ≈ 1.1 eV, Ge ≈ 0.67 eV); insulator has a large gap (> about 3 eV). Draw CB on top, VB below, label Eg.",svg(`<g class="sh"><rect x="15" y="20" width="90" height="55"/><rect x="15" y="60" width="90" height="55"/><rect x="155" y="20" width="90" height="30"/><rect x="155" y="105" width="90" height="35"/><rect x="295" y="14" width="90" height="22"/><rect x="295" y="125" width="90" height="30"/></g><text x="30" y="14">Conductor</text><text x="150" y="14">Semiconductor</text><text x="310" y="10">Insulator</text><text x="40" y="92">overlap</text><text x="180" y="82">Eg ≈ 1 eV</text><text x="318" y="85">Eg &gt; 3 eV</text><text x="165" y="40">CB</text><text x="165" y="128">VB</text>`)],
fermi:["Fermi level: intrinsic, n-type, p-type","Observe: intrinsic EF at mid-gap; n-type EF moves up near Ec (below donor level Ed); p-type EF moves down near Ev (above acceptor level Ea). Draw Ec, Ev, EF (dashed).",svg(`<g class="a"><path d="M10 30H120M10 130H120M145 30H255M145 130H255M280 30H390M280 130H390"/><path stroke-dasharray="5" d="M10 80H120M145 45H255M280 115H390"/><path stroke-dasharray="2" d="M145 36H255M280 124H390"/></g><text x="12" y="25">Ec</text><text x="12" y="145">Ev</text><text x="30" y="75">EF (mid-gap)</text><text x="150" y="60">EF</text><text x="150" y="33">Ed</text><text x="285" y="110">EF</text><text x="285" y="140">Ea</text><text x="30" y="165">Intrinsic</text><text x="165" y="165">n-type</text><text x="300" y="165">p-type</text>`)],
pnj:["P-n junction and depletion region","Observe: holes diffuse to n-side, electrons to p-side; immobile ions are left behind, forming the depletion region, an electric field E and barrier potential V0 (Si ≈ 0.7 V). Label p, n, depletion region, E, V0.",svg(`<rect class="a" x="10" y="30" width="130" height="70"/><rect class="a" x="260" y="30" width="130" height="70"/><rect class="sh" x="140" y="30" width="120" height="70"/><text x="40" y="60">p (holes ●)</text><text x="290" y="60">n (electrons ○)</text><text x="150" y="70">− − −   + + +</text><text x="150" y="25">Depletion region</text><path class="a" d="M255 115H145M145 115l8-4M145 115l8 4"/><text x="170" y="132">E (n → p)</text><text x="150" y="152">Barrier V0 ≈ 0.7 V (Si)</text>`,160)],
fw:["Forward bias and reverse bias","Observe: forward bias (p to +, n to −) narrows the depletion region, large current once V exceeds the barrier. Reverse bias widens it, only tiny leakage current.",svg(`<rect class="a" x="20" y="25" width="70" height="40"/><rect class="sh" x="90" y="25" width="30" height="40"/><rect class="a" x="120" y="25" width="70" height="40"/><text x="45" y="50">p</text><text x="150" y="50">n</text><text x="20" y="20">Forward: narrow, battery + on p</text><rect class="a" x="210" y="25" width="50" height="40"/><rect class="sh" x="260" y="25" width="80" height="40"/><rect class="a" x="340" y="25" width="50" height="40"/><text x="225" y="50">p</text><text x="360" y="50">n</text><text x="215" y="20">Reverse: wide, battery + on n</text><text x="20" y="95">Large forward current I</text><text x="215" y="95">Only tiny leakage current</text>`,110)],
vi:["P-n diode V-I characteristic","Observe: negligible forward current up to the knee (~0.7 V Si, ~0.3 V Ge), then rapid rise; reverse current is tiny and nearly constant until breakdown.",VI(0)],
hw:["Half-wave rectifier: circuit and waveforms","Observe: diode conducts only in positive half-cycles. Output pulses have the same frequency as the input; Vdc = Vm/π (ideal).",svg(`<circle class="a" cx="25" cy="95" r="14"/><text x="19" y="99">~</text><path class="a" d="M25 81V50H60M80 50H140V70M140 110V140H25V109"/><polygon class="a" points="60,40 60,60 80,50"/><path class="a" d="M80 40V60"/><rect class="a" x="132" y="70" width="16" height="40"/><text x="62" y="35">D</text><text x="152" y="95">RL</text><path class="a" d="M180 45H390M180 145H390"/><path class="cv" d="${W(185,45,25,200,0)}"/><path class="cv" d="${W(185,145,25,200,1)}"/><text x="185" y="12">Input vi</text><text x="185" y="112">Output vo (half-wave)</text>`,175)],
fwv:["Full-wave rectifier: waveforms","Observe: both half-cycles appear as positive pulses, so output frequency is 2f and Vdc = 2Vm/π (ideal). Bridge uses 4 diodes (two conduct per half-cycle); centre-tap uses 2 diodes and a centre-tapped transformer.",svg(`<path class="a" d="M15 45H390M15 145H390"/><path class="cv" d="${W(20,45,25,360,0)}"/><path class="cv" d="${W(20,145,25,360,2)}"/><text x="20" y="12">Input vi</text><text x="20" y="112">Output vo (full-wave)</text>`,175)],
zn:["Zener diode reverse characteristic","Observe: in reverse breakdown the voltage stays almost constant at Vz while current varies over a wide range. This is the basis of voltage regulation.",VI(1)],
tn:["Tunnel diode characteristic","Observe: current rises to a peak (Ip), falls through a negative-resistance region to a valley (Iv), then rises again like a normal diode. Label peak, valley, negative resistance region.",svg(`<path class="a" d="M40 140H380M40 140V10"/><path class="cv" d="M40 140Q75 40 100 42Q125 44 135 100Q145 118 160 115Q230 105 260 20"/><circle cx="100" cy="42" r="3"/><circle cx="150" cy="116" r="3"/><text x="108" y="38">Peak (Vp, Ip)</text><text x="158" y="132">Valley (Vv, Iv)</text><path class="sh" d="M105 60H148V105H105Z"/><text x="108" y="82">negative</text><text x="108" y="94">resistance</text><text x="360" y="155">V</text><text x="46" y="18">I</text>`,165)]};
// ---------- Question bank ----------
const Q=[
{id:1,m:1,tp:"Intrinsic & extrinsic",d:"Easy",imp:"⭐ Must Know",ty:"Distinguish",mk:3,q:"Distinguish between intrinsic and extrinsic semiconductors.",h:"Pure versus doped.",k:"Doping adds free carriers of one type.",s:["Intrinsic: pure semiconductor (pure Si or Ge). Electrons = holes = ni. Conductivity is low and rises with temperature.","Extrinsic: doped with donor or acceptor atoms. One carrier type is in majority, so conductivity is much higher and controllable."],a:"Intrinsic: pure, n = p = ni. Extrinsic: doped, n ≠ p.",ex:"Intrinsic: pure, n = p = ni, low conductivity. Extrinsic: doped with impurities, one carrier dominates (n-type or p-type), high controllable conductivity.",mi:"Saying extrinsic has only one carrier type; the minority carrier still exists.",sim:"What is n = p = ni called?",sa:"The intrinsic condition."},
{id:2,m:1,tp:"Carriers",d:"Easy",imp:"⭐ Must Know",ty:"Theory",mk:2,q:"What are electrons and holes? Why is a hole treated as a charge carrier?",h:"A broken covalent bond leaves a vacancy.",k:"Hole = absence of an electron, behaves as +e.",s:["At T > 0 K, thermal energy breaks some covalent bonds. A freed electron moves in the conduction band.","The vacancy left behind is a hole. Neighbouring electrons fill it, so the vacancy appears to move the opposite way.","Hence the hole acts like a positive charge carrier (charge +e)."],a:"Hole: vacancy in the valence band acting as a +e carrier.",ex:"An electron is a free negative carrier in the conduction band. A hole is the vacancy left in the valence band when an electron leaves; it moves as a positive carrier of charge +e.",mi:"Thinking a hole is a physical positive particle (it is a missing electron).",sim:"In an intrinsic semiconductor, how many holes per free electron?",sa:"One hole per electron (n = p)."},
{id:3,m:1,tp:"Mass action law",d:"Easy",imp:"⭐ Must Know",ty:"Theory",mk:2,q:"State the mass-action law and explain what happens to p when n is increased by doping.",h:"Product of two concentrations is constant at fixed T.",k:"n·p = ni²",s:["At thermal equilibrium: n × p = ni², where ni is the intrinsic carrier concentration (depends on material and temperature).","Doping increases n, so p must decrease so that the product stays ni²."],a:"n p = ni²; more electrons means fewer holes.",ex:"Mass-action law: at thermal equilibrium, n·p = ni² (same for intrinsic and extrinsic material at the same temperature). If doping raises n, p falls to ni²/n.",mi:"Using n + p = ni.",sim:"If ni = 10¹⁰ cm⁻³ and n = 10¹⁴ cm⁻³, find p.",sa:"p = 10²⁰/10¹⁴ = 10⁶ cm⁻³."},
{id:4,m:1,tp:"Mass action law",d:"Medium",imp:"🔥 High Priority",ty:"Numerical",mk:4,q:"Silicon (ni = 1.5×10¹⁰ cm⁻³ at 300 K, use the value given in your class) is doped with donors ND = 10¹⁶ cm⁻³. Find n and p.",h:"Assume all donors are ionized: n ≈ ND.",k:"n ≈ ND, p = ni²/n",s:["Given: ni = 1.5×10¹⁰ cm⁻³, ND = 10¹⁶ cm⁻³. Find: n, p.","n ≈ ND = 10¹⁶ cm⁻³ (ND ≫ ni).","p = ni²/n = (1.5×10¹⁰)²/10¹⁶ = 2.25×10²⁰/10¹⁶ = 2.25×10⁴ cm⁻³.","Meaning: electrons are the majority carriers, holes are about 10¹² times fewer: the semiconductor is n-type."],a:"n = 10¹⁶ cm⁻³, p = 2.25×10⁴ cm⁻³",ex:"n ≈ ND = 10¹⁶ cm⁻³. p = ni²/n = 2.25×10²⁰/10¹⁶ = 2.25×10⁴ cm⁻³.",mi:"Writing p = ni²·n or forgetting to square ni.",sim:"Same Si with acceptors NA = 5×10¹⁵ cm⁻³. Find p and n.",sa:"p ≈ 5×10¹⁵ cm⁻³; n = 2.25×10²⁰/5×10¹⁵ = 4.5×10⁴ cm⁻³."},
{id:5,m:1,tp:"P-type & N-type",d:"Easy",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"How are n-type and p-type semiconductors formed? Name the majority and minority carriers in each.",h:"Pentavalent gives extra electron; trivalent creates holes.",k:"Donor → n-type. Acceptor → p-type.",s:["N-type: add pentavalent atoms (P, As, Sb). Four electrons bond; the fifth is free. Donors become fixed +ve ions. Majority: electrons; minority: holes.","P-type: add trivalent atoms (B, Al, Ga). One bond lacks an electron, so a hole forms. Acceptors become fixed −ve ions. Majority: holes; minority: electrons.","Both types remain electrically neutral overall."],a:"n-type: donors, majority electrons. p-type: acceptors, majority holes.",ex:"n-type: Si doped with pentavalent donors (P, As); majority electrons, minority holes. p-type: Si doped with trivalent acceptors (B, Al); majority holes, minority electrons.",mi:"Saying n-type is negatively charged (it is neutral).",sim:"Which dopant type makes p-type Si?",sa:"Trivalent, for example boron."},
{id:6,m:1,tp:"Energy bands & Fermi level",d:"Medium",imp:"⭐ Must Know",ty:"Diagram",mk:4,q:"Draw the energy-band diagrams of conductor, semiconductor and insulator. Show the Fermi level in intrinsic, n-type and p-type semiconductors.",h:"Compare the size of Eg first.",k:"EF: mid-gap (intrinsic), near Ec (n), near Ev (p).",dg:["bands","fermi"],s:["Conductor: CB and VB overlap. Semiconductor: small Eg (Si ≈ 1.1 eV, Ge ≈ 0.67 eV). Insulator: large Eg (> about 3 eV).","Intrinsic: EF at (about) the middle of the gap.","n-type: donor level Ed just below Ec; EF shifts up toward Ec.","p-type: acceptor level Ea just above Ev; EF shifts down toward Ev.","Raising temperature moves EF in extrinsic material back toward mid-gap."],a:"EF: mid-gap, near CB, near VB.",ex:"Draw the three band diagrams, labelling CB, VB, Eg. Intrinsic: EF at mid-gap. n-type: EF close to Ec. p-type: EF close to Ev.",mi:"Drawing EF near Ev for n-type.",sim:"Where does EF lie in n-type Si at 0 K?",sa:"Between Ed and Ec, close to Ec."},
{id:7,m:1,tp:"P-n junction",d:"Medium",imp:"⭐ Must Know",ty:"Explain",mk:5,q:"Explain the formation of a p-n junction, the depletion region and the barrier potential.",h:"Diffusion first, then drift.",k:"Diffusion creates uncovered ions → field → barrier.",dg:["pnj"],s:["Holes are plentiful on the p-side, electrons on the n-side, so holes diffuse to n and electrons diffuse to p.","Near the junction they recombine. Uncovered fixed ions remain: negative acceptor ions on p-side, positive donor ions on n-side. This charge-free carrier-depleted zone is the depletion region.","The ions create an electric field E directed from n to p. It opposes further diffusion and causes drift of minority carriers.","At equilibrium diffusion current = drift current (net current zero). The potential across the depletion region is the barrier potential: ≈ 0.7 V for Si, ≈ 0.3 V for Ge at room temperature."],a:"Barrier ≈ 0.7 V (Si), 0.3 V (Ge).",ex:"Diffusion of carriers across the junction leaves immobile ions. The depletion region (no free carriers) produces a field n→p and barrier potential V0 (Si 0.7 V, Ge 0.3 V) which stops further diffusion at equilibrium.",mi:"Saying the depletion region contains many free carriers.",sim:"Which side of the depletion region has negative ions?",sa:"The p-side."},
{id:8,m:1,tp:"P-n junction",d:"Medium",imp:"⭐ Must Know",ty:"Distinguish",mk:4,q:"Explain forward and reverse bias of a p-n junction.",h:"Which terminal of the battery goes to p?",k:"Forward narrows depletion; reverse widens it.",dg:["fw"],s:["Forward bias: +ve to p, −ve to n. External voltage opposes V0, depletion narrows, majority carriers cross. Current is large once V exceeds the knee voltage.","Reverse bias: +ve to n, −ve to p. External voltage adds to V0, depletion widens, majority flow stops. Only a tiny leakage current (minority carriers) flows."],a:"Forward: low resistance, large I. Reverse: high resistance, tiny I.",ex:"Forward: p to +, depletion narrow, large current. Reverse: p to −, depletion wide, only small reverse saturation current.",mi:"Mixing which terminal is connected to p.",sim:"What happens to the depletion width in reverse bias?",sa:"It increases."},
{id:9,m:1,tp:"Diode equation",d:"Medium",imp:"⭐ Must Know",ty:"Theory",mk:3,q:"Write the diode equation and explain every term.",h:"Exponential in V, with a −1.",k:"I = I0 (e^(V/ηVT) − 1)",s:["I = I0 [ e^(V/(η VT)) − 1 ].","I0 = reverse saturation current. V = applied voltage (+ forward, − reverse). η = ideality factor (1 to 2). VT = kT/q ≈ 26 mV at 300 K.","Forward, V ≫ VT: I ≈ I0 e^(V/ηVT) (exponential). Reverse, V ≪ −VT: I ≈ −I0."],a:"I = I0(e^(V/ηVT) − 1), VT ≈ 26 mV.",ex:"I = I0[exp(V/ηVT) − 1], I0 saturation current, η ideality factor, VT = kT/q ≈ 26 mV at 300 K. Forward: I ≈ I0e^(V/ηVT). Reverse: I ≈ −I0.",mi:"Using V in mV or using VT = 0.26 V.",sim:"What is I when V = 0?",sa:"I0(1 − 1) = 0."},
{id:10,m:1,tp:"Diode equation",d:"Exam",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"A diode has I0 = 1 nA, η = 1, VT = 26 mV. Find the current at V = +0.3 V and at V = −0.3 V.",h:"Compute V/VT first.",k:"Use e^(V/VT) − 1.",s:["Given: I0 = 1×10⁻⁹ A, η = 1, VT = 0.026 V. Find I.","V = +0.3 V: V/VT = 0.3/0.026 = 11.54. e^11.54 ≈ 1.03×10⁵.","I = 10⁻⁹ × (1.03×10⁵ − 1) ≈ 1.03×10⁻⁴ A ≈ 0.10 mA.","V = −0.3 V: V/VT = −11.54, e^(−11.54) ≈ 9.7×10⁻⁶ (negligible).","I = 10⁻⁹ × (9.7×10⁻⁶ − 1) ≈ −1 nA.","Meaning: forward current is 10⁵ times I0, reverse current is just −I0."],a:"+0.3 V: ≈ 0.10 mA. −0.3 V: ≈ −1 nA.",ex:"V/VT = 11.54; I = 1 nA (e^11.54 − 1) ≈ 1.03×10⁻⁴ A (0.10 mA). Reverse: I ≈ −I0 = −1 nA.",mi:"Forgetting the −1 or using mV directly.",sim:"I0 = 2 nA, V = 0.2 V, VT = 26 mV. Find I.",sa:"V/VT = 7.69; e^7.69 ≈ 2.19×10³; I ≈ 2×10⁻⁹×2.19×10³ ≈ 4.4 µA."},
{id:11,m:1,tp:"V-I characteristics",d:"Medium",imp:"⭐ Must Know",ty:"Diagram",mk:5,q:"Draw and explain the V-I characteristics of a p-n junction diode.",h:"Three regions: forward, reverse, breakdown.",k:"Knee ≈ 0.7 V (Si), 0.3 V (Ge).",dg:["vi"],s:["Forward region: current is almost zero until the knee voltage (Si ≈ 0.7 V, Ge ≈ 0.3 V), then rises rapidly.","Reverse region: very small, almost constant reverse saturation current.","Breakdown: at a large reverse voltage the current rises sharply (avalanche or Zener effect)."],a:"Exponential forward curve, flat tiny reverse current, sharp breakdown.",ex:"Draw axes (V, I); forward curve with knee at 0.7 V (Si); reverse region with tiny I0; sharp rise at −VBR. Label each region.",mi:"Drawing reverse current as large.",sim:"Which material has the lower knee voltage, Ge or Si?",sa:"Ge (≈ 0.3 V)."},
{id:12,m:2,tp:"Rectifiers",d:"Medium",imp:"⭐ Must Know",ty:"Explain",mk:5,q:"Explain the working of a half-wave rectifier with circuit and waveforms. Find the average (dc) output for Vm = 10 V.",h:"Which half-cycle does the diode conduct in?",k:"Vdc = Vm/π (ideal diode).",dg:["hw"],s:["Circuit: AC source, diode D in series with load RL.","Positive half-cycle: D forward biased, conducts, output follows input. Negative half-cycle: D reverse biased, no output.","Output is a pulsating dc with the same frequency as the input.","Given Vm = 10 V. Vdc = Vm/π = 10/3.1416 = 3.18 V (ideal diode; no 0.7 V drop).","Meaning: only about 32% of the peak appears as average output."],a:"Vdc ≈ 3.18 V",ex:"D conducts in positive half-cycles only. Output = half sine pulses. Vdc = Vm/π = 10/π ≈ 3.18 V.",mi:"Using 2Vm/π (that is full-wave).",sim:"Vm = 20 V, find Vdc.",sa:"20/π = 6.37 V."},
{id:13,m:2,tp:"Rectifiers",d:"Medium",imp:"⭐ Must Know",ty:"Explain",mk:5,q:"Explain the working of a full-wave rectifier (centre-tap or bridge). Find Vdc for Vm = 10 V.",h:"Both half-cycles are used.",k:"Vdc = 2Vm/π; output frequency 2f.",dg:["fwv"],s:["Centre-tap: two diodes with a centre-tapped transformer; D1 conducts in the positive half-cycle and D2 in the negative half-cycle. Bridge: four diodes, two conduct each half-cycle.","In both half-cycles current passes through RL in the same direction.","Output frequency = 2f (for 50 Hz input, 100 Hz).","Vdc = 2Vm/π = 20/3.1416 = 6.37 V (ideal)."],a:"Vdc ≈ 6.37 V; output frequency 2f",ex:"Both half-cycles produce current through RL in the same direction. Vdc = 2Vm/π = 6.37 V for Vm = 10 V. Output frequency = 2f.",mi:"Forgetting that bridge voltage drops through two diodes in practice.",sim:"Vm = 15 V, find Vdc.",sa:"30/π = 9.55 V."},
{id:14,m:2,tp:"Rectifiers",d:"Easy",imp:"📌 Important",ty:"Distinguish",mk:3,q:"Compare half-wave and full-wave rectifiers.",h:"Compare diodes, frequency, Vdc.",k:"Full-wave: double Vdc, double ripple frequency.",s:["Half-wave: 1 diode; Vdc = Vm/π; output frequency f; uses one half-cycle.","Full-wave: 2 diodes (centre-tap) or 4 (bridge); Vdc = 2Vm/π; output frequency 2f; uses both half-cycles."],a:"Full-wave gives twice the dc output with 2f ripple frequency.",ex:"HW: 1 diode, Vdc = Vm/π, frequency f. FW: 2 or 4 diodes, Vdc = 2Vm/π, frequency 2f, easier to filter.",mi:"Saying half-wave has higher efficiency.",sim:"Output frequency of FW rectifier at 50 Hz input?",sa:"100 Hz."},
{id:15,m:2,tp:"Zener diode",d:"Medium",imp:"⭐ Must Know",ty:"Explain",mk:5,q:"Explain the Zener diode and how it regulates voltage.",h:"Which bias does a Zener normally use?",k:"Reverse breakdown holds V ≈ Vz.",dg:["zn"],s:["A Zener is a heavily doped p-n diode designed to operate in reverse breakdown.","In breakdown, the voltage stays almost constant at Vz while current changes a lot.","Regulator: Zener in parallel with load, series resistor Rs. If input voltage or load changes, the Zener current Iz absorbs the change and the load voltage stays ≈ Vz."],a:"Vload ≈ Vz.",ex:"Zener diode: heavily doped, used in reverse breakdown. V ≈ Vz over a wide range of Iz. Connected across the load with a series resistor, it keeps the output voltage constant.",mi:"Connecting the Zener in forward bias.",sim:"Zener in regulator is connected in parallel or series with load?",sa:"Parallel."},
{id:16,m:2,tp:"Zener diode",d:"Exam",imp:"🔥 High Priority",ty:"Numerical",mk:5,q:"A Zener regulator has Vin = 12 V, Rs = 200 Ω, Vz = 6 V and RL = 1 kΩ. Find the load current, total current and Zener current.",h:"Drop across Rs = Vin − Vz.",k:"Is = IL + Iz.",s:["Given: Vin = 12 V, Rs = 200 Ω, Vz = 6 V, RL = 1000 Ω. Find IL, Is, Iz.","Load voltage = Vz = 6 V. IL = 6/1000 = 6 mA.","Is = (Vin − Vz)/Rs = (12 − 6)/200 = 30 mA.","Iz = Is − IL = 30 − 6 = 24 mA.","Meaning: the Zener carries 24 mA; if RL falls, Iz decreases while VL stays near 6 V."],a:"IL = 6 mA, Is = 30 mA, Iz = 24 mA",ex:"VL = Vz = 6 V; IL = 6 mA; Is = (12 − 6)/200 = 30 mA; Iz = Is − IL = 24 mA.",mi:"Using Vin across RL.",sim:"Vin = 10 V, Rs = 100 Ω, Vz = 5 V, RL = 500 Ω. Find Iz.",sa:"Is = 50 mA, IL = 10 mA, Iz = 40 mA."},
{id:17,m:2,tp:"Breakdown",d:"Medium",imp:"🔥 High Priority",ty:"Distinguish",mk:4,q:"Explain avalanche breakdown. How does it differ from Zener breakdown?",h:"Think: collisions versus strong field.",k:"Avalanche: impact ionization. Zener: field emission.",s:["Avalanche: at high reverse voltage, carriers gain enough energy to knock out more electron-hole pairs by collision. The process multiplies, giving a sharp rise in current. Occurs in lightly doped, wide depletion junctions.","Zener: in heavily doped junctions with a thin depletion region, the intense field pulls electrons directly from bonds. Occurs at low voltages (below about 5 V).","Avalanche breakdown has a positive temperature coefficient; Zener breakdown has a negative one (around 5–6 V they cancel)."],a:"Avalanche = collision multiplication; Zener = field emission.",ex:"Avalanche: impact ionization, lightly doped, higher voltage, positive temp. coefficient. Zener: field emission, heavily doped, low voltage (< about 5 V), negative temp. coefficient.",mi:"Saying avalanche occurs in heavily doped diodes.",sim:"Which breakdown occurs at lower voltage?",sa:"Zener breakdown."},
{id:18,m:2,tp:"Tunnel diode",d:"Medium",imp:"⭐ Must Know",ty:"Diagram",mk:5,q:"Explain the tunnel diode and its V-I characteristic.",h:"Heavy doping gives tunnelling. Find the negative-slope region.",k:"Negative resistance between peak and valley.",dg:["tn"],s:["Tunnel diode: very heavily doped p-n junction with a very thin depletion region; carriers tunnel through the barrier.","Characteristic: current rises to a peak (Ip, Vp), then falls to a valley (Iv, Vv): this region has negative resistance (dI/dV < 0). Beyond the valley, current rises again like a normal diode.","Applications: high-frequency oscillators and fast switching."],a:"Negative resistance between peak and valley.",ex:"Tunnel diode: heavily doped, thin depletion region. Draw I versus V with peak, valley and negative-resistance region; use in oscillators and high-speed switching.",mi:"Drawing the curve without the falling portion.",sim:"Between which two points is resistance negative?",sa:"Between peak and valley points."},
{id:19,m:2,tp:"Photodetectors",d:"Medium",imp:"⭐ Must Know",ty:"Explain",mk:5,q:"Explain the structure and working of a PIN photodiode. Find the longest wavelength it can detect if Eg = 1.1 eV (Si).",h:"Photon energy must be at least Eg. λ(nm) = 1240/E(eV).",k:"hν ≥ Eg",s:["Structure: p+ layer, wide intrinsic (i) layer, n+ layer; operated in reverse bias.","Reverse bias makes the i-layer fully depleted with a strong field. A photon with hν ≥ Eg creates an electron-hole pair; the field sweeps them apart, producing photocurrent proportional to light intensity.","Wide i-layer: lower capacitance, faster response, better light absorption than a plain p-n photodiode.","Cutoff wavelength: λc = hc/Eg = 1240 nm·eV / 1.1 eV = 1127 nm ≈ 1.13 µm.","Meaning: Si responds to visible and near-infrared light up to about 1.1 µm."],a:"λc ≈ 1127 nm",ex:"PIN: p+, intrinsic, n+; reverse biased. Photon (hν ≥ Eg) generates e-h pairs in the i-region, swept by the field to give photocurrent. λc = 1.24/Eg µm = 1.24/1.1 ≈ 1.13 µm.",mi:"Using forward bias for a photodiode.",sim:"Find λc for Ge (Eg = 0.67 eV).",sa:"1240/0.67 ≈ 1851 nm ≈ 1.85 µm."},
{id:20,m:2,tp:"Solar cell",d:"Medium",imp:"⭐ Must Know",ty:"Explain",mk:4,q:"Explain the principle of a solar cell.",h:"No external battery: light is the energy source.",k:"Photovoltaic effect at a p-n junction.",s:["Structure: thin n (or p) layer on a p-n junction with a metal grid and a back contact.","Photons with hν ≥ Eg create electron-hole pairs near the junction. The built-in field separates them: electrons to n-side, holes to p-side.","This gives an open-circuit voltage Voc across the terminals and delivers current Isc through an external load. No external bias is applied."],a:"Light → e-h pairs → built-in field → photovoltage and current.",ex:"Solar cell works on the photovoltaic effect: photons generate e-h pairs at the p-n junction; the built-in field separates them, giving voltage and current in an external load without bias.",mi:"Saying a solar cell needs reverse bias.",sim:"What is the bias on a solar cell?",sa:"None (zero external bias)."},
{id:21,m:2,tp:"LED",d:"Medium",imp:"⭐ Must Know",ty:"Explain",mk:5,q:"Explain the working of an LED. A GaAsP LED has Eg = 1.9 eV; find the emitted wavelength.",h:"Recombination releases a photon of energy ≈ Eg.",k:"λ(nm) = 1240/Eg(eV).",s:["LED: forward-biased p-n junction made of a direct-gap material (GaAs, GaAsP, GaN) so recombination gives light.","Forward bias injects electrons into p and holes into n. Recombination near the junction releases energy as a photon: hν ≈ Eg.","Colour depends on Eg (material, not on the current).","λ = 1240/1.9 = 652.6 nm ≈ 653 nm (red)."],a:"λ ≈ 653 nm (red)",ex:"LED: forward-biased p-n junction of a direct-gap material. Electron-hole recombination emits a photon of energy hν ≈ Eg. λ = 1240/1.9 ≈ 653 nm (red).",mi:"Saying LED uses silicon (Si is an indirect-gap material and emits very little light).",sim:"Find λ for Eg = 2.4 eV.",sa:"1240/2.4 ≈ 517 nm (green)."},
{id:22,m:2,tp:"Optoelectronic devices",d:"Exam",imp:"🔥 High Priority",ty:"Distinguish",mk:4,q:"Compare photodiode, solar cell and LED (bias, energy conversion).",h:"Which one emits light, and which one gives power?",k:"Photodiode: reverse. Solar cell: none. LED: forward.",s:["Photodiode: reverse bias; light → current (detects light).","Solar cell: no bias; light → electrical power.","LED: forward bias; electrical energy → light."],a:"Detector, power source, light source.",ex:"Photodiode: reverse biased, converts light to signal current. Solar cell: unbiased, converts light to electrical power. LED: forward biased, converts electrical energy to light.",mi:"Swapping the bias conditions.",sim:"Which of the three is forward biased?",sa:"LED."}
];
const QK=[["Barrier potential of Si / Ge?","≈ 0.7 V / ≈ 0.3 V"],["Majority carriers in n-type?","Electrons"],["Mass-action law?","n·p = ni²"],["Fermi level in intrinsic semiconductor?","Near the middle of the gap"],["Zener diode is operated in which region?","Reverse breakdown"],["Output frequency of a full-wave rectifier (input 50 Hz)?","100 Hz"],["Vdc of half-wave rectifier?","Vm/π"],["Vdc of full-wave rectifier?","2Vm/π"],["Region of tunnel diode with dI/dV < 0?","Between peak and valley (negative resistance)"],["Bias of a photodiode?","Reverse"],["Bias of a solar cell?","None"],["Bias of an LED?","Forward"],["Photon energy condition for e-h pair generation?","hν ≥ Eg"],["Thermal voltage VT at 300 K?","≈ 26 mV"]];
const SHEET=`MODULE 1
Intrinsic: n = p = ni.  Mass action: n·p = ni².  n-type: n ≈ ND, p = ni²/ND.  p-type: p ≈ NA, n = ni²/NA.
Eg: Si ≈ 1.1 eV, Ge ≈ 0.67 eV.  EF: mid-gap (intrinsic), near Ec (n), near Ev (p).
Barrier: Si ≈ 0.7 V, Ge ≈ 0.3 V.  Forward: depletion narrows. Reverse: widens.
Diode: I = I0[e^(V/ηVT) − 1], VT = kT/q ≈ 26 mV at 300 K. Reverse: I ≈ −I0.
MODULE 2
Half-wave: Vdc = Vm/π (ideal), freq f. Full-wave: Vdc = 2Vm/π, freq 2f.
Zener: reverse breakdown, VL ≈ Vz. Is = (Vin − Vz)/Rs, Iz = Is − IL.
Avalanche: impact ionization, thick/light doping. Zener: field emission, heavy doping, low V.
Tunnel: heavy doping, negative resistance between peak and valley.
PIN: reverse biased, wide i-layer, hν ≥ Eg. Solar cell: no bias. LED: forward bias, recombination.
Wavelength: λ(nm) = 1240/E(eV).
MISTAKES: p = ni²·n · reverse/forward mix-up · using mV for VT in volts · 2Vm/π for half-wave · Zener in forward bias.`;
// ---------- App ----------
let tab="top",S={},pi=0,mock=null,timer=null;try{S=JSON.parse(localStorage.getItem("g121")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("g121",JSON.stringify(S))}catch(e){}};
const st=id=>S[id]||(S[id]={att:0,ok:0,need:0}),$=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const TOP=[7,8,9,11,12,13,15,16,18,19,21,4,10,6];
const RK=q=>q.imp.includes("Must")?0:q.imp.includes("High")?1:q.imp.includes("Important")?2:3;
const mastered=q=>st(q.id).ok>0&&!st(q.id).need;
const TABS=[["top","⭐ Top"],["must","Must Know"],["prac","🧠 Practice"],["quick","Quick Q"],["dia","Diagrams"],["sheet","Quick Revision"],["qa","Master Q&A"],["prog","Progress"],["mock","Mock Test"]];
function nav(){const n=document.getElementById("nav");n.innerHTML="";TABS.forEach(([k,l])=>{const b=$("button",tab==k?"on":"",l);b.onclick=()=>{tab=k;render()};n.append(b)})}
function flash(t){const e=$("div","note",t);document.getElementById("app").prepend(e);setTimeout(()=>e.remove(),1600)}
function topicNeed(){const b={};Q.forEach(q=>{b[q.tp]=(b[q.tp]||0)+(st(q.id).need||0)});return b}
function weakTopic(){const b=topicNeed();return Object.keys(b).find(k=>b[k]>=1)}
function status(tp){const qs=Q.filter(q=>q.tp==tp);let a=0,o=0,n=0;qs.forEach(q=>{const s=st(q.id);a+=s.att;o+=s.ok;n+=s.need||0});if(!a)return"⚪ Not started";if(n)return"🔴 Weak";return o>=qs.length?"🟢 Strong":"🟡 Needs Practice"}
function next(){const tp=weakTopic();let c=[];if(tp)c=Q.filter(q=>q.tp==tp&&!mastered(q)&&!st(q.id).need);if(!c.length)c=sorted();return{tp,q:c[0]}}
function sorted(){return Q.filter(q=>!mastered(q)).sort((x,y)=>(st(y.id).need?1:0)-(st(x.id).need?1:0)||RK(x)-RK(y)||x.id-y.id)}
function dgBox(k){const d=DG[k];const w=$("div","box");w.innerHTML=`<b>${d[0]}</b>\n${d[2]}<div class="note">${esc(d[1])}</div>`;return w}
function card(q,nv){const c=$("div","card"),s=st(q.id);let step=0;
c.innerHTML=`<span class="tag">M${q.m}</span><span class="tag">${q.tp}</span><span class="tag">${q.d}</span><span class="tag">${q.imp}</span><span class="tag">${q.ty}</span><span class="tag">${q.mk} marks (suggested practice)</span><div class="q">Q${q.id}. ${esc(q.q)}</div>`;
const out=$("div"),row=$("div","row");c.append(row,out);
const add=(l,f,cls)=>{const b=$("button",cls||"",l);b.onclick=f;row.append(b)};
add("🤔 Think",()=>out.append($("div","box","Pause. What do you already know about this? Write 2–3 lines, then use the hint.")));
add("💡 Hint",()=>out.append($("div","box",esc(q.h))));
add("🔑 Key concept",()=>out.append($("div","box",esc(q.k))));
if(q.dg)add("🖼 Diagram",()=>q.dg.forEach(k=>out.append(dgBox(k))));
add("👣 Explain",()=>{if(step<q.s.length){out.append($("div","box",`<b>Step ${step+1}:</b> ${esc(q.s[step++])}`));s.att++;save()}});
add("✅ Answer",()=>out.append($("div","box",`<b>Final answer:</b> ${esc(q.a)}\n<b>⚠ Common mistake:</b> ${esc(q.mi)}`)),"p");
add("📝 Exam answer",()=>out.append($("div","box",`<b>Write in the exam:</b> ${esc(q.ex)}`)));
add("🔁 Similar",()=>{const w=$("div","box",`<b>Similar:</b> ${esc(q.sim)}\n`);const b=$("button","","Reveal answer");b.onclick=()=>{w.append($("div","",`<b>Answer:</b> ${esc(q.sa)}`));b.remove()};w.append(b);out.append(w)});
add("✔ I got it",()=>{s.ok++;s.att++;s.need=0;save();flash("Marked understood")});
add("❌ Need practice",()=>{s.need=(s.need||0)+1;s.att++;save();flash("Added to revision list");const t=weakTopic();if(t)flash("You need more practice with "+t+" — see the Practice tab.")});
if(nv){add("◀ Prev",()=>{pi=Math.max(0,pi-1);render()});add("Next ▶",()=>{pi++;render()},"p")}
return c}
function render(){nav();clearInterval(timer);const a=document.getElementById("app");a.innerHTML="";
if(tab=="top"){a.append($("div","card note","⭐ High-priority preparation questions — not a prediction of the paper. Start here, in order."));TOP.forEach(i=>a.append(card(Q.find(q=>q.id==i))))}
else if(tab=="must"){Q.filter(q=>q.imp.includes("Must")).forEach(q=>a.append(card(q)))}
else if(tab=="prac"){const L=sorted();if(!L.length){a.append($("div","card","All questions mastered 🎉"));return}const n=next();if(n.tp)a.append($("div","card","<b>You need more practice with "+esc(n.tp)+".</b> Try the next question."));pi=Math.min(pi,L.length-1);a.append($("div","card note",`Need-practice first, then Must Know → High → others. Question ${pi+1} of ${L.length} unmastered.`));a.append(card(n.tp&&pi==0&&n.q?n.q:L[pi],1))}
else if(tab=="quick"){a.append($("div","card note","Rapid recall: answer in your head, then reveal."));QK.forEach(([q,an])=>{const c=$("div","card","<b>"+esc(q)+"</b>"),b=$("button","","Reveal");b.onclick=()=>{c.append($("div","box",esc(an)));b.remove()};const rw=$("div","row");rw.append(b);c.append(rw);a.append(c)})}
else if(tab=="dia"){a.append($("div","card note","Diagram revision. Covered: bands, Fermi levels, p-n junction, forward/reverse bias, diode V-I, half-wave and full-wave waveforms, Zener, tunnel diode. PIN, solar cell and LED are explained in their questions (no drawing yet)."));Object.keys(DG).forEach(k=>a.append($("div","card",dgBox(k).innerHTML)))}
else if(tab=="sheet")a.append($("div","card","<h3>📌 Quick Revision</h3><pre>"+esc(SHEET)+"</pre>"));
else if(tab=="qa"){Q.forEach(q=>{const d=$("details","card");d.innerHTML=`<summary><b>Q${q.id}.</b> ${esc(q.q)}</summary><div class="box"><b>Answer:</b> ${esc(q.a)}\n<b>Exam answer:</b> ${esc(q.ex)}\n<b>Steps:</b>\n${q.s.map(esc).join("\n")}\n<b>Mistake:</b> ${esc(q.mi)}</div>`;a.append(d)})}
else if(tab=="mock"){mockView(a)}
else{let t=0,o=0,nd=0;Q.forEach(q=>{t+=st(q.id).att;o+=st(q.id).ok;nd+=st(q.id).need?1:0});const c=f=>Q.filter(f).length;
let h=`<h3>Master Q&A summary</h3><p>Total ${Q.length} · Module 1: ${c(q=>q.m==1)} · Module 2: ${c(q=>q.m==2)} · ⭐ Must Know ${c(q=>q.imp.includes("Must"))} · 🔥 High ${c(q=>q.imp.includes("High"))} · 📌 Important ${c(q=>q.imp.includes("Important"))}</p><p>Numerical ${c(q=>q.ty=="Numerical")} · Diagram ${c(q=>q.dg)} · Distinguish ${c(q=>q.ty=="Distinguish")} · Explain/Theory ${c(q=>q.ty=="Explain"||q.ty=="Theory")}</p><h3>Progress</h3><p>Attempted steps ${t} · Understood ${o} · Need practice ${nd} · Mastered ${c(mastered)}/${Q.length}</p>`;
[1,2].forEach(m=>{const mq=Q.filter(q=>q.m==m);h+=`<div>Module ${m}: ${mq.filter(mastered).length}/${mq.length} mastered</div>`});h+="<br>";
[...new Set(Q.map(q=>q.tp))].forEach(x=>h+=`<div>${status(x)} — ${x}</div>`);
const nx=next();if(nx.q)h+=`<p><b>Recommended next:</b> Q${nx.q.id} (${esc(nx.q.tp)}) — open the Practice tab.</p>`;
const ms=S._mock||[];if(ms.length)h+=`<p><b>Mock scores:</b> ${ms.map(m=>m.s+"/"+m.n).join(", ")}</p>`;
const cd=$("div","card",h),b=$("button","","Reset progress");b.onclick=()=>{if(confirm("Reset all progress on this device?")){S={};save();render()}};cd.append(b);a.append(cd)}}
function mockView(a){const IDS=[1,3,4,7,9,10,12,15,16,19];
if(!mock){const c=$("div","card","<h3>Mock Test — practice set (format provisional)</h3><p class='note'>10 questions from the bank. Write answers on paper or in the boxes. Answers stay hidden until you finish. Not an official pattern.</p>");const b1=$("button","p","Start timed (30 min)"),b2=$("button","","Start untimed");b1.onclick=()=>{mock={ids:IDS,end:Date.now()+1800000,done:0};render()};b2.onclick=()=>{mock={ids:IDS,end:0,done:0};render()};const rw=$("div","row");rw.append(b1,b2);c.append(rw);a.append(c);return}
const hd=$("div","card","<b id='tm'></b>");a.append(hd);const tick=()=>{if(mock&&mock.end&&!mock.done){const r=Math.max(0,mock.end-Date.now());document.getElementById("tm").textContent="Time left: "+Math.floor(r/60000)+":"+String(Math.floor(r/1000)%60).padStart(2,"0");if(!r){mock.done=1;render()}}else if(document.getElementById("tm"))document.getElementById("tm").textContent=mock.done?"Review mode":"Untimed"};tick();timer=setInterval(tick,1000);
let score=0;mock.ids.forEach((id,i)=>{const q=Q.find(x=>x.id==id),c=$("div","card",`<b>${i+1}. ${esc(q.q)}</b> <span class="tag">${q.mk} marks</span>`);if(!mock.done)c.append($("textarea"));else{c.append($("div","box",`<b>Answer:</b> ${esc(q.ex)}\n${q.s.map(esc).join("\n")}`));const r=$("div","row"),g=$("button","","✔ I got it"),w=$("button","","❌ Missed");g.onclick=()=>{mock["r"+id]=1;st(id).ok++;st(id).att++;st(id).need=0;save();render()};w.onclick=()=>{mock["r"+id]=0;st(id).need=(st(id).need||0)+1;st(id).att++;save();render()};r.append(g,w);c.append(r);if(mock["r"+id]!=null)c.append($("div","note",mock["r"+id]?"Marked correct":"Marked for practice"));score+=mock["r"+id]?1:0}a.append(c)});
if(!mock.done){const f=$("button","p","Finish & show answers");f.onclick=()=>{mock.done=1;render()};a.append(f)}else{const rated=mock.ids.filter(i=>mock["r"+i]!=null).length;a.append($("div","card",`Self-rated: ${rated}/${mock.ids.length}. Score ${score}/${mock.ids.length}`));const sv=$("button","p","Save score & exit");sv.onclick=()=>{S._mock=(S._mock||[]).concat([{s:score,n:mock.ids.length}]);save();mock=null;render()};a.append(sv)}}
render();
</script></body></html>
